<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<title>Homepage Studio</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/studio.css">
<link rel="stylesheet" href="/page.css">
</head>
<body class="pagemode">
<a class="skip" href="#pageFrame">Skip to page</a>

<div class="shell">
  <header class="bar" id="bar">
    <h1 class="brand" id="brand"><span class="brand-t">Homepage Studio</span></h1>

    <div class="menu" id="barMenu">
      <div class="ctl"><label for="baseline">Page</label><select id="baseline"></select></div>
      <div class="ctl"><label for="tool">Tool</label><select id="tool"></select></div>
      <div class="ctl"><label for="engine">Engine</label><select id="engine"></select></div>
      <a class="btn small" id="outlineLink" href="/outline.html">Outline view</a>
      <button type="button" class="btn small" id="logout" hidden>Log out</button>
    </div>

    <div class="bar-end">
      <button type="button" class="pill-job" id="jobPill" hidden></button>
      <span class="savestat" id="saveStatus" role="status" aria-live="polite" data-state="saving"><i aria-hidden="true"></i><span id="saveText">Loading...</span></span>
      <button type="button" class="btn ibtn" id="settingsBtn" aria-expanded="false" aria-controls="barMenu" aria-label="Studio settings">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="8" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        <span class="lbl">Settings</span>
      </button>
      <button type="button" class="btn ibtn" id="interact" aria-pressed="false" title="Interact: use the page's own prompt bar, panels and chapters">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10l5.2 1.4a2 2 0 0 1 1.4 2.4L17.8 18a3 3 0 0 1-2.9 2H11a3 3 0 0 1-2.3-1.1L5 14.5l1.2-1.1a1.5 1.5 0 0 1 2 0z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span class="lbl">Interact</span>
      </button>
      <button type="button" class="btn ibtn" id="theme" role="switch" aria-checked="true" title="Dark mode (page and studio)">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span class="lbl" id="themeLabel">Dark</span>
      </button>
      <button type="button" class="btn ibtn" id="historyBtn" aria-haspopup="dialog" title="Version history of copy and figures, and fields not editable in place">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span class="lbl">History</span>
      </button>
    </div>
  </header>

  <div id="strip" class="strip" role="status" hidden></div>

  <main class="stage" id="stage">
    <iframe id="pageFrame" title="Landing page, editable in place" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
  </main>
</div>

<div id="sheetBk" class="sheet-bk" hidden></div>
<aside id="sheet" class="sheet" role="dialog" aria-modal="false" aria-labelledby="sheetTitle" hidden tabindex="-1">
  <div class="sheet-grip" id="sheetGrip"><span aria-hidden="true"></span></div>
  <div class="sheet-head">
    <h2 id="sheetTitle">History</h2>
    <button type="button" class="btn" id="sheetClose">Close</button>
  </div>
  <div id="sheetBody" class="sheet-body"></div>
</aside>

<div id="login" class="dialog small" role="dialog" aria-modal="true" aria-labelledby="loginTitle" hidden tabindex="-1">
  <h2 id="loginTitle">Log in</h2>
  <form id="loginForm">
    <label for="loginPw">Studio password</label>
    <input id="loginPw" type="password" autocomplete="current-password" required>
    <p id="loginErr" class="err" role="alert"></p>
    <button type="submit" class="btn primary">Log in</button>
  </form>
</div>
<div id="modalBk" class="modal-bk" hidden></div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="/page.js"></script>
</body>
</html>

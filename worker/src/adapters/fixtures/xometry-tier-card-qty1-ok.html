<!doctype html>
<!-- OVD-1094 synthetic, derived from the hand-built 2026-10 price-panel fixture.
     The line-item input and printed price-card quantity are independent. -->
<html lang="en"><head><meta charset="utf-8"><title>Synthetic quote</title></head>
<body><div id="draggable-parts"><div class="part-card">
  <label>Quantity <input type="number" value="1"></label>
  <div><label>Price and Lead Time</label>
    <div class="price-tier">
      <div kind="outlineWhite">
        <div>Standard</div>
        <label data-testid="tierAndLeadTime">Arrives by Nov 6</label>
        <div kind="discount"><span>Qty 1 pc</span><span> · $43.21</span></div>
      </div>
    </div>
  </div>
</div></div></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E10">
<title>Jarvis PWA v3 · OVD-799 North Star mock (sample data)</title>
<style>
/*FONTS*/
/* v2: quiet chat. One accent (#FF7A1A), used at most once per screen. Radius 0/2/4, no shadows, no gradients (docs/DESIGN.md). */
:root{--bg:#0E0E10;--surface:#18181B;--hairline:#2A2A2F;--text:#F2F1EE;--muted:#A3A3AA;--accent:#FF7A1A;--on-accent:#0E0E10;
 --sans:"Plex Sans",ui-sans-serif,sans-serif;--mono:"Plex Mono",ui-monospace,monospace;--tap:44px;--pad:20px;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sample{font:11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding:6px 0}
.app{min-height:100dvh;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 4px 0 var(--pad);padding-top:env(safe-area-inset-top)}
.brand{font-weight:600;font-size:17px}
.icon{min-width:var(--tap);min-height:var(--tap);border:0;background:none;color:var(--muted);font:12px var(--mono);letter-spacing:.08em}
main{flex:1;padding:8px var(--pad) 24px;display:flex;flex-direction:column;gap:22px}
.you{align-self:flex-end;max-width:85%;background:var(--surface);border-radius:4px;padding:10px 14px}
.jar p{margin:0 0 10px}.jar p:last-child{margin:0}
.status{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.status .dot{width:6px;height:6px;background:var(--muted);flex:none}
.status button{margin-left:auto;min-height:var(--tap);min-width:var(--tap);border:0;background:none;color:var(--muted);font:12px var(--mono);letter-spacing:.08em}
.caret{display:inline-block;width:8px;height:16px;background:var(--muted);vertical-align:-2px;margin-left:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{min-height:var(--tap);padding:0 14px;border:1px solid var(--hairline);border-radius:4px;background:none;font:14px var(--mono)}
.chip.rec{border-color:var(--accent);color:var(--accent)}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.model{border:1px solid var(--hairline);border-radius:4px;overflow:hidden;margin-top:12px}
.model .view{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;background:var(--surface)}
.model svg{display:block;width:70%;margin:0 auto;padding:18px 0}
.model .bar{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 14px;border-top:1px solid var(--hairline)}
.model .name{flex:1;min-width:0;font:13px var(--mono);color:var(--muted)}
.btn{min-height:var(--tap);min-width:var(--tap);padding:0 14px;border:1px solid var(--hairline);border-radius:4px;background:none;font:12px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.btn.fill{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ghost{border-color:transparent;color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
.composer{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
.composer textarea{flex:1;min-height:var(--tap);resize:none;padding:11px 14px;background:var(--surface);color:var(--text);border:1px solid var(--hairline);border-radius:4px;font:16px/1.3 var(--sans)}
.composer textarea::placeholder{color:var(--muted)}
.shot .composer{position:static}
.sheetwrap{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--surface);border-top:1px solid var(--hairline);padding:8px 8px calc(12px + env(safe-area-inset-bottom))}
.sheet button{display:block;width:100%;min-height:52px;text-align:left;padding:0 16px;border:0;background:none;font-size:16px}
.sheet .sep{height:1px;background:var(--hairline);margin:4px 0}
.state{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;min-height:var(--tap);padding:0 var(--pad);font:12px var(--mono);letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--hairline);cursor:pointer}
.state b{font-weight:500;color:var(--text)}
.read{margin:12px 0 0;padding:0;list-style:none;border-top:1px solid var(--hairline)}
.read li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--hairline);font-size:14px}
.read li span:first-child{flex:none;width:96px;font:12px/1.9 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.alts{margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.alt{all:unset;box-sizing:border-box;display:block;min-height:56px;padding:10px 14px;border:1px solid var(--hairline);border-radius:4px;cursor:pointer}
.alt[aria-pressed="true"]{border-color:var(--text)}
.alt .v{font:15px var(--mono)}.alt .e{display:block;font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;margin-top:12px}.row .btn{flex:1}
.lanes{margin:0;padding:0;list-style:none}
.lanes li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:14px;border-bottom:1px solid var(--hairline)}
.lanes li span:last-child{font:12px/1.9 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>
<div id="mock"></div>
<div id="root"></div>
<script>
const STATES=[["direct","Directing an outcome"],["parallel","Agents working"],["decide","Decision with evidence"],["result","Verified candidate"],["more","Overflow menu open"]];
const q=new URLSearchParams(location.search), state=q.get("state")||"direct", shot=q.get("shot")==="1";
const hdr=`<header class="hdr"><div class="brand">Jarvis</div><button class="icon" aria-label="Menu">MENU</button></header>`;
const stateLine=(w)=>`<button class="state" aria-label="Design state. Baseline none, Working ${w}, Committed none. Tap for details">Baseline <b>none</b> · Working <b>${w}</b> · Committed <b>none</b></button>`;
const you=`<div class="you">Make a 4 inch square plate.</div>`;
const composer=(ph="Message Jarvis")=>`<form class="composer" onsubmit="return false" aria-label="Message Jarvis"><label class="sr" for="m">Message</label><textarea id="m" rows="1" placeholder="${ph}"></textarea><button class="btn" aria-label="Send">SEND</button></form>`;
const plate=`<svg viewBox="0 0 120 70" aria-hidden="true"><polygon points="30.6,35 60,52 60,56.2 30.6,39.2" fill="#1F1F23" stroke="#F2F1EE" stroke-width=".8"/><polygon points="60,52 89.4,35 89.4,39.2 60,56.2" fill="#2C2C31" stroke="#F2F1EE" stroke-width=".8"/><polygon points="60,18 89.4,35 60,52 30.6,35" fill="#161619" stroke="#F2F1EE" stroke-width=".8"/></svg>`;
const S={};
S.direct=()=>`${you}
 <div class="jar"><p>Here is how Jarvis reads it. Nothing runs until you start it.</p>
 <ul class="read" aria-label="Interpreted request">
  <li><span>Outcome</span><span>Square plate, 4 in per side</span></li>
  <li><span>Open</span><span>Thickness and material not specified. Jarvis asks only if a choice matters.</span></li>
  <li><span>Plan</span><span>Concept picks, CAD, then an independent check</span></li></ul>
 <div class="row"><button class="btn fill">START</button><button class="btn">EDIT</button></div></div>`;
S.parallel=()=>`${you}
 <div class="jar"><p>Started. Work runs on its own; you hear from Jarvis only for a judgment call.</p>
 <ul class="lanes" aria-label="Work in progress" aria-live="polite">
  <li><span>Concept picks</span><span>Done</span></li>
  <li><span>CAD model</span><span>Working</span></li>
  <li><span>Independent check</span><span>Waits for CAD</span></li></ul></div>
 <div class="status" role="status"><span class="dot" aria-hidden="true"></span><span>Working · nothing committed</span><button aria-label="Job options, pause or cancel" aria-haspopup="menu">MORE</button></div>`;
S.decide=()=>`${you}
 <div class="jar"><p>One judgment call before CAD: plate thickness. Material is not specified, so each option is compared on stiffness, weight and machining only.</p>
 <div class="alts" role="group" aria-label="Thickness alternatives">
  <button class="alt" aria-pressed="true"><span class="v">0.250 in · recommended</span><span class="e">Common stock thickness for a general plate.</span></button>
  <button class="alt" aria-pressed="false"><span class="v">0.125 in</span><span class="e">Lighter. Flexes more under load.</span></button>
  <button class="alt" aria-pressed="false"><span class="v">0.500 in</span><span class="e">Stiffer. Heavier and costs more to machine.</span></button></div>
 <div class="row"><button class="btn fill">APPROVE 0.250 IN</button><button class="btn" aria-describedby="sk">SKIP</button></div>
 <p class="hint" id="sk">Skip and Jarvis uses 0.250 in as its best guess, records it, and keeps going. You can change it until CAD starts.</p></div>`;
S.result=()=>`${you}
 <div class="jar"><p>Candidate ready and independently checked: 101.6 × 101.6 × 6.35 mm. Thickness 0.250 in was a recorded best guess.</p>
 <p class="small">This is a Working candidate. Nothing is committed and the baseline is unchanged. STEP is the authoritative file; the 3D view is for review.</p>
 <div class="model"><button class="view" aria-label="Open 3D view of PLATE_R1">${plate}</button>
  <div class="bar"><span class="name">PLATE_R1 · sample</span><button class="btn fill">OPEN 3D</button><button class="btn ghost" aria-label="More: evidence and check results, view in AR, download STEP, units" aria-haspopup="menu">MORE</button></div></div></div>`;
S.more=()=>S.result();
const sheet=`<div class="sheetwrap"><div class="sheet" role="menu" aria-label="Candidate options"><button role="menuitem">Evidence and check results</button><button role="menuitem">Decisions and recorded guesses</button><div class="sep"></div><button role="menuitem">View in AR</button><button role="menuitem">Download STEP</button><button role="menuitem">Show inches</button></div></div>`;
document.getElementById("mock").innerHTML=`<div class="sample" data-mock>Sample data</div>`;
if(shot)document.body.classList.add("shot");
document.getElementById("root").innerHTML=`<div class="app">${hdr}${state==="direct"?"":stateLine("PLATE R1")}<main>${(S[state]||S.direct)()}</main>${composer()}</div>${state==="more"?sheet:""}`;
</script>
</body>
</html>

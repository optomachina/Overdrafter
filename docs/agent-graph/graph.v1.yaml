{
  "schema": "overdrafter.agent-graph/v1",
  "version": "1.0.0-draft.3",
  "note": "Canonical OverDrafter agent graph. Written in the JSON subset of YAML so it parses with no dependencies. Owns routing, verdicts and the merge gate; AGENTS.md owns approvals, the auto-merge allowlist and sensitive paths. Validate with: node scripts/validate-agent-graph.mjs",
  "root": "grok-bot",
  "nodes": {
    "grok-bot": {
      "role": "root",
      "note": "only seat that talks to Blaine; countersigns gate-loosening changes; council seat"
    },
    "jev": {
      "role": "router",
      "does": [
        "pr-screen",
        "risk-score"
      ]
    },
    "auto-triage": {
      "role": "router",
      "does": [
        "issue-route"
      ]
    },
    "engineer": {
      "role": "writer",
      "runtimes": [
        "claude-code",
        "codex"
      ]
    },
    "designer": {
      "role": "writer",
      "runtimes": [
        "claude-code",
        "codex"
      ]
    },
    "sonnet": {
      "role": "reviewer",
      "family": "anthropic"
    },
    "opus": {
      "role": "reviewer",
      "family": "anthropic"
    },
    "codex": {
      "role": "reviewer",
      "family": "openai",
      "note": "second reviewer family (Blaine, 2026-10-16)"
    },
    "grok": {
      "role": "reviewer",
      "family": "xai",
      "note": "overflow reviewer and council seat"
    },
    "qa": {
      "role": "verifier",
      "must_not_author": true
    },
    "merge-gate": {
      "role": "gate"
    },
    "release": {
      "role": "release"
    },
    "ci": {
      "role": "ci",
      "note": "hosted GitHub Actions checks"
    }
  },
  "predicates": {
    "sensitive-paths": "PR or issue scope touches AGENTS.md#sensitive-paths-single-shared-list",
    "jev-risky": "Jev screen scores the PR risky",
    "reviewer-overflow": "a primary reviewer is unavailable or rate-limited",
    "protected": "the change needs a protected action (merge outside the auto-merge allowlist, production migration)"
  },
  "edge_semantics": "An edge is a possible handoff from `from` to `to`. With no `when`, it always fires. `when` lists predicate names, and the edge fires only if all of them hold (AND). `unless` lists predicate names, and the edge fires only if none hold. If the condition fails and `else` names a node, work goes there instead; otherwise the edge doesn't fire. Several edges from one node that fire together run in parallel (e.g. reviewers). Every predicate must be declared in `predicates`. Event edges add: `trigger` (the event that fires the edge), `gate` (a condition checked at the head SHA before handoff), `dedupe` (key; at most one handoff per key), `handoff` (how the target is notified), `backstop` (a polling job that catches missed events), and `mode` (`report` posts only; `enforce` may block). `issue` names the tracking ticket.",
  "edges": [
    {
      "from": "auto-triage",
      "to": "engineer",
      "unless": [
        "sensitive-paths"
      ],
      "else": "release"
    },
    {
      "from": "engineer",
      "to": "jev"
    },
    {
      "from": "designer",
      "to": "jev"
    },
    {
      "from": "jev",
      "to": "sonnet"
    },
    {
      "from": "jev",
      "to": "codex"
    },
    {
      "from": "jev",
      "to": "opus",
      "when": [
        "jev-risky"
      ]
    },
    {
      "from": "jev",
      "to": "opus",
      "when": [
        "sensitive-paths"
      ]
    },
    {
      "from": "jev",
      "to": "grok",
      "when": [
        "reviewer-overflow"
      ]
    },
    {
      "from": "sonnet",
      "to": "qa"
    },
    {
      "from": "codex",
      "to": "qa"
    },
    {
      "from": "opus",
      "to": "qa"
    },
    {
      "from": "grok",
      "to": "qa"
    },
    {
      "from": "qa",
      "to": "merge-gate"
    },
    {
      "from": "merge-gate",
      "to": "release",
      "when": [
        "protected"
      ]
    },
    {
      "from": "ci",
      "to": "qa",
      "issue": "OVD-865",
      "trigger": "workflow_run.completed",
      "gate": "required_checks_green@head_sha",
      "dedupe": "pr+head_sha",
      "handoff": "label qa:ready + marker comment",
      "backstop": "macmini-hourly",
      "mode": "report"
    }
  ],
  "verdicts": {
    "qa": {
      "values": [
        "PASS",
        "PASS_NOTES",
        "FAIL"
      ],
      "bound_to": "head_sha",
      "voided_by": "new_sha",
      "rebase_reuse": "patch-id-equal"
    },
    "readiness": {
      "values": [
        "READY",
        "CONFLICTS",
        "OPEN_THREADS",
        "CHECKS_PENDING",
        "CHECKS_FAILED",
        "GATE_BLOCKED"
      ],
      "note": "typed output of a script; input to automerge eligibility (OVD-845)"
    }
  },
  "merge_gate": {
    "requires": [
      "ci_green",
      "review_no_open_findings",
      "qa_PASS_or_PASS_NOTES_at_head",
      "readiness_READY"
    ],
    "auto_merge_also_requires": [
      "jev_not_risky",
      "allowlisted_paths_only"
    ],
    "rules": [
      "Green CI and an approving bot review are not verdicts; only the verifier's verdict counts, and the verifier must not have authored the code.",
      "Review the diff, never an abstract plan. A finding raised by two model families is the strongest signal.",
      "Land only the contiguous verified run, bottom-up, and read each merge back on main. A queued merge or armed auto-merge is not a merge.",
      "Babysitting (rebases, threads, CI reruns) never authorizes a merge. Classify a CI failure before retrying: one fresh build for a flake, never blind retries.",
      "verify-overdrafter is the first verification investment; verifiers use it once it exists."
    ],
    "auto_merge_allowlist": "AGENTS.md#approval-timing-and-low-risk-auto-merge-blaine-2026-10-14",
    "sensitive_paths": "AGENTS.md#sensitive-paths-single-shared-list"
  },
  "protected": {
    "live-database-change": "manual; never automated",
    "gate-loosening": "root-agent countersign plus Blaine's OK"
  },
  "adapters": [
    "AGENTS.md",
    "CLAUDE.md",
    "openclaw-mini:~/.hermes/SOUL.md",
    "agent-data/workflows/agent-orchestrator-linear/SKILL.md"
  ]
}

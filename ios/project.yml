name: OverDrafter

options:
  createIntermediateGroups: true
  settingPresets: project
  deploymentTarget:
    iOS: "17.4"
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configurations/Debug.xcconfig
  Release: Configurations/Release.xcconfig

targets:
  OverDrafter:
    type: application
    platform: iOS
    sources:
      - path: OverDrafter
        excludes:
          - Supporting/Info-Debug.plist
          - Supporting/Info.plist
          - Supporting/OverDrafter.entitlements
    settings:
      base:
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: OverDrafter/Supporting/OverDrafter.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: com.optomachina.overdrafter
        PRODUCT_NAME: OverDrafter
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          INFOPLIST_FILE: OverDrafter/Supporting/Info-Debug.plist
        Release:
          INFOPLIST_FILE: OverDrafter/Supporting/Info.plist

  OverDrafterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OverDrafterTests
    dependencies:
      - target: OverDrafter
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: com.optomachina.overdrafter.tests
        SDKROOT: iphoneos
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OverDrafter.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OverDrafter"

schemes:
  OverDrafter:
    build:
      targets:
        OverDrafter: all
        OverDrafterTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: OverDrafterTests
    archive:
      config: Release

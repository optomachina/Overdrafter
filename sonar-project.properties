# Keep SQL migration function rewrites from tripping CPD quality gates on new code.
# Migrations often intentionally repeat prior function bodies before incremental edits.
# Fictiv adapter rollout intentionally mirrors mature Xometry paths for operational parity.
# Quantity-sweep CLI tools are intentionally parallel scaffolds, one per vendor.
sonar.cpd.exclusions=supabase/migrations/20260403103000_harden_client_quote_workspace_lineage.sql,supabase/migrations/20260405110000_seed_vendor_capability_profiles.sql,supabase/migrations/20260730100000_secure_commercial_admin_operations.sql,supabase/tests/commercial_admin_security.sql,worker/src/scoring.ts,worker/src/adapters/fictiv.ts,worker/src/adapters/fictivConstraints.ts,worker/src/adapters/fictiv.test.ts,worker/src/adapters/extendedVendorWorkflows.ts,worker/src/tools/fictivAuth.ts,worker/src/tools/fictivQuantitySweep.ts,worker/src/tools/xometryQuantitySweep.ts,worker/src/tools/vendorAuth.ts,worker/src/tools/vendorWorkflowSmoke.ts

# PostgreSQL migrations and pgTAP fixtures intentionally repeat contract literals.
# Replacing these with procedural constants would make the deployed DDL and test
# assertions harder to audit without improving runtime behavior.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=plsql:S1192

# OVD-872: gitleaks config. Docs: docs/secret-scanning.md.
#
# Any edit to this file is gate_loosening: it needs a Grok Bot countersign
# plus Blaine's card. scripts/check-secret-paths.mjs reports every edit.

title = "Overdrafter gitleaks config"

# Inline allow comments are forbidden. gitleaks v8.30.1 has no config-file key
# for this (config.ViperConfig has none), so every scan must pass the CLI flag
# --ignore-gitleaks-allow (cmd/root.go). The only exemption is a fingerprint in
# the base checkout's .gitleaksignore. See docs/secret-scanning.md.

# Use gitleaks' built-in default rules unchanged.
[extend]
useDefault = true

# Allowlist: intentionally empty, and not an exemption route. gitleaks rejects
# an [[allowlists]] table with no checks in it, so there is none. Exemptions
# are fingerprints in .gitleaksignore, which CI reads from the base checkout.

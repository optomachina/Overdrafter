name: Set up root Node.js dependencies
description: >-
  Install Node.js 20 with the npm download cache keyed on package-lock.json, then
  run npm ci for the root package. Shared by the lint, typecheck, test and build
  jobs in ci.yml. Jobs whose install differs keep their own steps: browser-test
  installs with --ignore-scripts, and the worker jobs use worker/package-lock.json.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install root dependencies
      shell: bash
      run: npm ci

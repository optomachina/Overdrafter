name: OVD-797 draft pgTAP (ephemeral CI database)

# Proves the parked OVD-797 Jarvis channels migration draft and its pending
# pgTAP in a throwaway local Supabase database on the runner. It applies the
# draft on top of supabase/migrations inside the runner's own Docker, checks
# that the rollback returns the exact pre-draft schema (DM-1R), runs the pending
# tests, then applies the rollback (twice: a replay is a no-op). It never
# connects to a real Supabase project and uses no secrets. Non-required and
# path-scoped; delete it once the draft is promoted into supabase/migrations in
# a Blaine-approved window. Same structure as ovd766-pending-pgtap.yml.

on:
  pull_request:
    paths:
      - 'docs/migration-drafts/ovd-797-*'
      - 'supabase/tests/pending/ovd797*'
      - '.github/workflows/ovd797-pending-pgtap.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  draft-pgtap:
    name: Draft migrations + pending pgTAP (ephemeral DB)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.78.1

      - name: Pull Supabase images from public ECR
        # setup-cli v1.6.0 exports SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io to GITHUB_ENV,
        # which rate-limits supabase start. A later GITHUB_ENV write wins; public.ecr.aws is
        # the CLI's own default registry (internal/utils/docker.go, v2.78.1).
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws" >> "$GITHUB_ENV"

      - name: Start local database and apply supabase/migrations
        run: supabase db start

      - name: Select drafts and pending tests
        id: select
        run: |
          shopt -s nullglob
          drafts=()
          for f in docs/migration-drafts/ovd-797-*.sql; do
            [[ "$f" == *.rollback.sql ]] || drafts+=("$f")
          done
          rollbacks=(docs/migration-drafts/ovd-797-*.rollback.sql)
          tests=(supabase/tests/pending/ovd797*.sql.pending)
          printf 'draft: %s\n' "${drafts[@]}"
          printf 'rollback: %s\n' "${rollbacks[@]}"
          printf 'test: %s\n' "${tests[@]}"
          [ "${#drafts[@]}" -gt 0 ] && [ "${#rollbacks[@]}" -gt 0 ] && [ "${#tests[@]}" -gt 0 ] || { echo "::error::no drafts, rollbacks or pending tests selected"; exit 1; }
          echo "drafts=${drafts[*]}" >> "$GITHUB_OUTPUT"
          echo "rollbacks=${rollbacks[*]}" >> "$GITHUB_OUTPUT"
          echo "tests=${tests[*]}" >> "$GITHUB_OUTPUT"

      - name: DM-1R rollback returns the exact pre-draft schema
        run: |
          dump() {
            docker run --rm --network host -v "$PWD:/w" -w /w postgres:17 \
              pg_dump "$DB_URL" --schema-only --no-owner --restrict-key=ovd797 -f "$1"
          }
          run_sql() {
            docker run --rm --network host -v "$PWD:/w" -w /w postgres:17 \
              psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q --single-transaction -f "$1"
          }
          dump pre-draft.sql
          for f in ${{ steps.select.outputs.drafts }}; do run_sql "$f"; done
          for f in ${{ steps.select.outputs.rollbacks }}; do run_sql "$f"; done
          dump post-rollback.sql
          diff -u pre-draft.sql post-rollback.sql
          echo "DM-1R: pg_dump --schema-only diff is empty ($(wc -l < pre-draft.sql) lines)"

      - name: Apply drafts to the ephemeral database
        run: |
          for f in ${{ steps.select.outputs.drafts }}; do
            echo "::group::apply $f"
            docker run --rm --network host -v "$PWD:/w" -w /w postgres:17 \
              psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q -f "$f"
            echo "::endgroup::"
          done

      - name: Run pending pgTAP against the drafts
        run: |
          stage="$(mktemp -d)"
          for f in ${{ steps.select.outputs.tests }}; do
            cp "$f" "$stage/$(basename "${f%.pending}")"
          done
          ls -l "$stage"
          supabase test db --local --debug "$stage" | tee pgtap.txt
          grep -q '^Result: PASS' pgtap.txt
          ! grep -Eq '^not ok|# (SKIP|TODO)' pgtap.txt

      - name: Apply rollbacks (they must replay cleanly)
        run: |
          for pass in 1 2; do
            for f in ${{ steps.select.outputs.rollbacks }}; do
              echo "::group::rollback pass $pass $f"
              docker run --rm --network host -v "$PWD:/w" -w /w postgres:17 \
                psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q -f "$f"
              echo "::endgroup::"
            done
          done

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup || true

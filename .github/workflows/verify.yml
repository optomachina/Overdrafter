name: Verify

# Runs the verify-overdrafter skill (OVD-843, epic OVD-840) against the PR head
# on a local stack: supabase start, npm run build, then the Playwright journeys
# the feature map names, in fixture and local mode. Synthetic fixtures only; no
# hosted credentials or secrets. This is not a required check.
#
# npm run build is only a compile gate: both Playwright configs serve the app
# from the vite dev server, so the journeys never load dist/.
#
# Each mode runs only the VERIFY_FEATURES that have specs in that mode in the
# base feature map (provider has fixture specs only). The others are recorded
# as "SKIPPED: no <mode> specs" in the manifest, the judge result and the
# summary, and never count as a pass. Playwright runs with
# --workers=$VERIFY_WORKERS: default workers timed journeys out on CI runners.
#
# Two jobs, so PR code never shares a filesystem with the judge:
# - run: checks out the PR head (./head, the app under test) and the base
#   (./base, the harness entrypoint .agents/skills/verify-overdrafter/run and its
#   feature map), hashes the base harness right before the journeys, runs them
#   and uploads the raw evidence.
# - judge: checks out only the base, downloads the evidence and judges it with
#   the base scripts/verify-result-judge.mjs. What a PR cannot change: the judge
#   and verdict logic, and the base feature map that decides which specs and
#   configs each mode must cover. When the base has no harness yet the verdict
#   is FAIL, with a summary that says so.
#
# The harness hash is advisory only. It is taken in the run job after PR code
# has already run (npm ci, npm run build, npm run db:start from the head's
# package.json), and that code can write $GITHUB_ENV (BASH_ENV, PATH), leave a
# background process, or change and restore the base harness. So the hash
# catches accidental drift, not a hostile PR.
#
# Known limits: the journeys are PR code, so a PR can still forge its own
# Playwright report. For pull_request events this workflow file itself also
# comes from the PR merge ref, and retargeting the base without a push does not
# re-run it (edited is not a trigger). The split stops the PR from rewriting the
# judge or the verdict; it is not full isolation of untrusted tests.
#
# Fails closed: a missing harness, a skipped, cancelled, timed-out or
# test.fail() journey, a mapped spec with no journeys, a missing result file, a
# dirty tree or a tested SHA other than the head SHA is FAIL. Evidence
# (manifests, Playwright JSON, traces, screenshots, videos) and
# verify-result.json are uploaded as artifacts either way.
#
# VERIFY_MODE=report (default) marks the verdict in the job summary and an
# annotation but exits 0, and every run-job step after the harness check is
# continue-on-error. Switch it to enforce to fail the jobs on FAIL.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  merge_group:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERIFY_MODE: report
  VERIFY_FEATURES: auth,quote,provider
  VERIFY_WORKERS: 1
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}

jobs:
  verify-run:
    name: verify (run journeys at head)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      harness_sha256: ${{ steps.harness-hash.outputs.sha256 }}

    steps:
      - name: Checkout base (harness)
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false

      - name: Check base harness
        id: harness
        run: |
          if [ -f base/.agents/skills/verify-overdrafter/run ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Verify::Base $BASE_SHA has no verify harness (.agents/skills/verify-overdrafter/run). Verdict: FAIL."
          fi

      - name: Checkout PR head (app under test)
        if: ${{ steps.harness.outputs.present == 'true' }}
        continue-on-error: ${{ env.VERIFY_MODE != 'enforce' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          path: head
          persist-credentials: false

      - name: Setup Supabase CLI
        if: ${{ steps.harness.outputs.present == 'true' }}
        continue-on-error: ${{ env.VERIFY_MODE != 'enforce' }}
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.78.1

      - name: Pull Supabase images from public ECR
        if: ${{ steps.harness.outputs.present == 'true' }}
        # setup-cli v1.6.0 exports SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io to GITHUB_ENV,
        # which rate-limits supabase start. A later GITHUB_ENV write wins; public.ecr.aws is
        # the CLI's own default registry (internal/utils/docker.go, v2.78.1).
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws" >> "$GITHUB_ENV"

      - name: Setup Node.js
        if: ${{ steps.harness.outputs.present == 'true' }}
        continue-on-error: ${{ env.VERIFY_MODE != 'enforce' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: head/package-lock.json

      - name: Install root dependencies
        if: ${{ steps.harness.outputs.present == 'true' }}
        continue-on-error: ${{ env.VERIFY_MODE != 'enforce' }}
        working-directory: head
        run: npm ci --ignore-scripts

      - name: Resolve Playwright version
        if: ${{ steps.harness.outputs.present == 'true' }}
        id: playwright-version
        continue-on-error: ${{ env.VERIFY_MODE != 'enforce' }}
        working-directory: head
        run: |
          version="$(node -p "require('playwright/package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: ${{ steps.harness.outputs.present == 'true' && steps.playwright-version.outputs.version != '' }}
        continue-on-error: ${{ env.VERIFY_MODE != 'enforce' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        if: ${{ steps.harness.outputs.present == 'true' }}
        continue-on-error: ${{ env.VERIFY_MODE != 'enforce' }}
        working-directory: head
        run: |
          node ./node_modules/playwright/cli.js install --with-deps chromium
          test -x /opt/google/chrome/chrome && /opt/google/chrome/chrome --version

      - name: Build app
        if: ${{ steps.harness.outputs.present == 'true' }}
        continue-on-error: ${{ env.VERIFY_MODE != 'enforce' }}
        working-directory: head
        run: npm run build

      - name: Start local Supabase
        if: ${{ steps.harness.outputs.present == 'true' }}
        continue-on-error: ${{ env.VERIFY_MODE != 'enforce' }}
        working-directory: head
        run: npm run db:start

      # Same command as the judge job; the judge compares the two.
      - name: Hash base harness
        if: ${{ steps.harness.outputs.present == 'true' }}
        id: harness-hash
        continue-on-error: ${{ env.VERIFY_MODE != 'enforce' }}
        working-directory: base/.agents/skills/verify-overdrafter
        run: echo "sha256=$(find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Run feature-map journeys (base harness, head app)
        if: ${{ steps.harness.outputs.present == 'true' }}
        continue-on-error: ${{ env.VERIFY_MODE != 'enforce' }}
        timeout-minutes: 25
        run: |
          code=0
          bash base/.agents/skills/verify-overdrafter/run --app-root head --out verify-out --features "$VERIFY_FEATURES" || code=$?
          git -C head status --porcelain > verify-out/head-status.txt
          exit "$code"

      - name: Upload raw evidence
        if: ${{ always() && steps.harness.outputs.present == 'true' }}
        continue-on-error: ${{ env.VERIFY_MODE != 'enforce' }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence-${{ env.HEAD_SHA }}
          path: verify-out/
          retention-days: 14
          if-no-files-found: warn

  verify-judge:
    name: verify
    needs: verify-run
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout base (judge)
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false

      - name: Check base harness
        id: harness
        run: |
          if [ -f base/.agents/skills/verify-overdrafter/run ] && [ -f base/scripts/verify-result-judge.mjs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            cd base/.agents/skills/verify-overdrafter
            echo "sha256=$(find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download raw evidence
        if: ${{ steps.harness.outputs.present == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: verify-evidence-${{ env.HEAD_SHA }}
          path: evidence

      - name: Setup Node.js
        if: ${{ steps.harness.outputs.present == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Judge result (base judge)
        if: ${{ steps.harness.outputs.present == 'true' }}
        env:
          HARNESS_SHA256: ${{ steps.harness.outputs.sha256 }}
          HARNESS_RECORDED: ${{ needs.verify-run.outputs.harness_sha256 }}
        run: |
          mkdir -p result
          node base/scripts/verify-result-judge.mjs --expected-sha "$HEAD_SHA" --features "$VERIFY_FEATURES" \
            --harness-sha256 "$HARNESS_SHA256" --harness-recorded "$HARNESS_RECORDED" \
            --out result/verify-result.json evidence/fixture evidence/local \
            > result/summary.md || true
          cat result/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload verify result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-result-${{ env.HEAD_SHA }}
          path: result/
          retention-days: 14
          if-no-files-found: warn

      - name: Apply verdict
        if: ${{ always() }}
        env:
          HARNESS_PRESENT: ${{ steps.harness.outputs.present }}
        run: |
          # Workflow-command escaping (core.escapeData): journey names come from PR specs.
          escape() { local s="${1//%/%25}"; s="${s//$'\r'/%0D}"; printf '%s' "${s//$'\n'/%0A}"; }
          result=result/verify-result.json
          judged=false
          if [ "$HARNESS_PRESENT" != true ]; then
            verdict=FAIL; why="base $BASE_SHA has no verify harness (.agents/skills/verify-overdrafter/run and scripts/verify-result-judge.mjs)"
          elif [ ! -f "$result" ]; then
            verdict=FAIL; why="verify-result.json missing"
          elif ! jq -e --arg sha "$HEAD_SHA" '.headShas == [$sha]' "$result" > /dev/null; then
            verdict=FAIL; why="evidence was not tested at head $HEAD_SHA (headShas: $(jq -c .headShas "$result"))"
          else
            judged=true
            verdict="$(jq -r '.verdict // "FAIL"' "$result")"
            why="$(jq -r '.reasons[:5] | join("; ")' "$result")"
          fi
          if [ "$verdict" = PASS ]; then
            echo "verify: PASS at $HEAD_SHA"
            exit 0
          fi
          [ "$judged" = true ] || printf '## verify-overdrafter: FAIL\n\n%s\n' "$why" >> "$GITHUB_STEP_SUMMARY"
          why="$(escape "$why")"
          if [ "$VERIFY_MODE" = enforce ]; then
            echo "::error title=Verify::FAIL at $HEAD_SHA: $why"
            exit 1
          fi
          echo "::warning title=Verify::FAIL at $HEAD_SHA (report mode, not failing the job): $why"

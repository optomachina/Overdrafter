name: Free-quote SQL qualification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  free-quote-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set runner-local evidence path
        shell: bash
        run: echo "FREE_QUOTE_EVIDENCE=$RUNNER_TEMP/free-quote-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Full history, file contents fetched on demand (blobless).
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify unchanged SQL inputs and offline runner contracts
        run: |
          node scripts/generate-free-quote-fixtures.mjs --check
          node --test scripts/ovd591-image-pull.node-test.mjs scripts/generate-free-quote-fixtures.node-test.mjs scripts/ovd591-ci-fixture.node-test.mjs scripts/ovd591-sql-qualification.node-test.mjs scripts/ovd591-psql-concurrency.node-test.mjs scripts/ovd591-retention-concurrency.node-test.mjs scripts/free-quote-ci-profile.node-test.mjs scripts/free-quote-ci-provisioner.node-test.mjs scripts/free-quote-platform-sources.node-test.mjs scripts/free-quote-psql-races.node-test.mjs
      # Cache keyed on the exact pinned image references. A loaded copy has no RepoDigests, so the fixture admits it only when
      # its image ID equals the receipt recorded at save time from a real registry pull; otherwise it pulls as before.
      - name: Resolve pinned Supabase image cache
        id: images
        run: |
          echo "OVD591_IMAGE_CACHE=$HOME/.cache/ovd591-images" >> "$GITHUB_ENV"
          node --input-type=module -e "
            const { IMAGE } = await import('./scripts/ovd591-sql-qualification.mjs');
            const { PLATFORMS } = await import('./scripts/free-quote-platform-sources.mjs');
            const images = [IMAGE, PLATFORMS.auth.image, PLATFORMS.storage.image];
            console.log('images=' + images.join(' ')); console.log('key=ovd591-ecr-v1-' + images.join('+'));" >> "$GITHUB_OUTPUT"
      - name: Restore cached Supabase images
        id: image-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ovd591-images
          key: ${{ steps.images.outputs.key }}
      - name: Load cached Supabase images
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: node scripts/ovd591-image-pull.mjs load "$OVD591_IMAGE_CACHE"
      - name: Qualify full139 schema, baseline126, atomicity132, free suites and eighteen races
        run: |
          set -euo pipefail
          node scripts/ovd591-ci-fixture.mjs run-free-quote "$FREE_QUOTE_EVIDENCE"
          if ! test -s "$FREE_QUOTE_EVIDENCE/fixture-result.json" || ! jq -e '.status == "passed"' "$FREE_QUOTE_EVIDENCE/fixture-result.json" > /dev/null; then
            echo "::error::SQL qualification exited successfully without a passed fixture receipt."
            exit 1
          fi
      - name: Receipt and save the registry-pulled Supabase images
        id: image-save
        if: ${{ !cancelled() && steps.image-cache.outputs.cache-hit != 'true' }}
        env:
          IMAGES: ${{ steps.images.outputs.images }}
        run: if node scripts/ovd591-image-pull.mjs save "$OVD591_IMAGE_CACHE" $IMAGES; then echo "saved=true" >> "$GITHUB_OUTPUT"; fi
      - name: Store the Supabase image cache
        if: ${{ !cancelled() && steps.image-save.outputs.saved == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ovd591-images
          key: ${{ steps.images.outputs.key }}
      - name: Confirm exclusively owned cleanup
        if: always()
        shell: bash
        run: |
          if test -f "$FREE_QUOTE_EVIDENCE/owned-state.json"; then
            node scripts/ovd591-ci-fixture.mjs cleanup "$FREE_QUOTE_EVIDENCE"
          fi
      - name: Retain synthetic SQL qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-quote-sql-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FREE_QUOTE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14

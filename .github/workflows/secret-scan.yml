# OVD-872: secret scanning, report mode. Blaine approved the pinned gitleaks
# v8.30.1 binary and this report-mode workflow on 2026-10-16 ("secret scanning
# tool is approved"). The `ci` aggregate does not need it. Branch protection
# on main lists `secret-scan` as a required check (read-only check,
# 2026-10-31); continue-on-error is unchanged, and enforcing is a later,
# separate approval.
#
# merge_group runs the same scan for real on the queue commit, never a no op:
# the range is merge_group.base_sha (the main tip the queue built on) to
# merge_group.head_sha (the queue commit), and the config, ignore list and
# path block come from that base, as on pull_request. The range covers this
# PR's change plus any queue entries ahead of it, so it never scans less than
# the pull_request run. See docs/runbooks/merge-queue.md.
#
# Edits to this file, .gitleaks.toml or any .gitleaksignore are gate_loosening:
# Grok Bot countersign plus Blaine's card. The path block reports the last two;
# this file is flagged only as infra_ci by docs/sensitive-paths.json.
# Docs: docs/secret-scanning.md.
name: secret-scan

on:
  pull_request:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  # merge_group has no PR number; its ref (gh-readonly-queue/main/pr-<n>-<sha>)
  # is unique per queue entry, so entries never cancel each other.
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Report mode: findings never fail this job. A scanner that cannot run fails
    # it loudly, and continue-on-error keeps even that from failing the run.
    continue-on-error: true
    env:
      GITLEAKS_VERSION: "8.30.1"
      # From gitleaks_8.30.1_checksums.txt on the official GitHub release.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      # Each event reads only its own payload; the other side is empty, which
      # the base step rejects as not a full commit sha.
      BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
    # GitHub runs each `run:` below as `bash -e`. Every exit code that matters
    # is captured with `|| rc=$?`, so the step summary is written before the
    # step decides its own exit. PR-controlled text (paths, scanner logs) is
    # printed between ::stop-commands:: markers so it cannot issue workflow
    # commands.
    steps:
      - name: Checkout (full history for the base..head range)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load base copies of the config and path block
        id: base
        # The PR's own .gitleaks.toml, .gitleaksignore and path block are never
        # used. The scan step also ignores inline gitleaks:allow comments and
        # the PR's .gitattributes.
        run: |
          set -uo pipefail
          config="$RUNNER_TEMP/gitleaks.toml"
          checker="$RUNNER_TEMP/check-secret-paths.mjs"
          src="$RUNNER_TEMP/scan-src"
          rc=0
          error=""
          config_from=""
          checker_from=""
          ignore_from=""
          # An empty or malformed sha would turn "$BASE_SHA:path" into an
          # index path, which is the PR's copy.
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            rc=2
            error="BASE_SHA or HEAD_SHA is not a full commit sha"
          elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            rc=2
            error="the base or head commit is not in the checkout"
          else
            if git cat-file -e "${BASE_SHA}:.gitleaks.toml" 2>/dev/null; then
              git show "${BASE_SHA}:.gitleaks.toml" > "$config" || rc=$?
              config_from="base .gitleaks.toml"
            else
              # The base has no config yet (the PR that adds it): default rules only.
              printf '%s\n' '[extend]' 'useDefault = true' > "$config" || rc=$?
              config_from="gitleaks default rules (the base has no .gitleaks.toml)"
            fi
            if git cat-file -e "${BASE_SHA}:scripts/check-secret-paths.mjs" 2>/dev/null; then
              git show "${BASE_SHA}:scripts/check-secret-paths.mjs" > "$checker" || rc=$?
              checker_from="base scripts/check-secret-paths.mjs"
            else
              rm -f "$checker" || rc=$?
              checker_from="none (the base has no path block yet, so that step is skipped)"
            fi
            # Fingerprint exemptions come only from the base branch's root
            # .gitleaksignore (Release ruling; inline gitleaks:allow is never
            # honoured). A head-side copy is never read: gitleaks gets the base
            # copy (empty when the base has none), and the checked-out root
            # copy, which gitleaks would otherwise read from the source
            # directory, is removed. Any line a PR adds is reported by the path
            # block as gate_loosening.
            ignore_from="none (the base has no .gitleaksignore)"
            if git cat-file -e "${BASE_SHA}:.gitleaksignore" 2>/dev/null; then
              git show "${BASE_SHA}:.gitleaksignore" > "$RUNNER_TEMP/gitleaksignore-base" || rc=$?
              ignore_from="base .gitleaksignore"
            else
              : > "$RUNNER_TEMP/gitleaksignore-base" || rc=$?
            fi
            rm -f .gitleaksignore || rc=$?
            if [ "$rc" -ne 0 ]; then
              error="writing the base copies failed"
            else
              # Both scans read the PR range from this worktree, never from the
              # PR's work tree. git reads .gitmodules and .mailmap (and
              # .gitattributes) from the work tree: a malformed .gitmodules
              # makes `git log` exit 128 before it prints any diff, and a
              # .mailmap symlink prints an error. This worktree has no files
              # and no index, and its HEAD is the base, so git falls back to
              # the base commit's copies. It shares the checkout's objects, so
              # every PR commit is still there.
              git worktree add --quiet --detach --no-checkout "$src" "$BASE_SHA" || rc=$?
              if [ "$rc" -ne 0 ]; then error="creating the scan worktree at the base commit failed"; fi
            fi
          fi
          {
            echo '### Secret scan inputs (base copies only)'
            if [ "$rc" -ne 0 ]; then
              echo "**ERROR: $error (exit $rc), so nothing was scanned.**"
            else
              echo "- gitleaks config: $config_from"
              echo "- path block: $checker_from"
              echo "- fingerprint exemptions: ${ignore_from}"
              echo "- head-side .gitleaksignore: never used"
              echo "- git reads the PR range from a worktree at the base commit with nothing checked out, so no .gitattributes, .gitmodules or .mailmap from the PR is read"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "secret-scan: $error (exit $rc)"
            exit 1
          fi
          echo "gitleaks config: $config_from"
          echo "path block: $checker_from"

      - name: Secret path block (report mode)
        id: paths
        # Blocked paths and gate_loosening are reported, never failed. Only a
        # checker that cannot produce a result fails this step.
        run: |
          set -uo pipefail
          checker="$RUNNER_TEMP/check-secret-paths.mjs"
          src="$RUNNER_TEMP/scan-src"
          text="$RUNNER_TEMP/secret-paths.txt"
          if [ ! -s "$checker" ]; then
            echo "Skipped: the base has no scripts/check-secret-paths.mjs yet."
            {
              echo '### Secret path block (report mode)'
              echo "Skipped: the base has no \`scripts/check-secret-paths.mjs\` yet, and the PR's own copy is never used."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rc=0
          # From the base worktree, so `git diff` never reads the PR's .gitmodules.
          (cd "$src" && node "$checker" --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA") > "$text" 2>&1 || rc=$?
          result=error
          if [ "$rc" -eq 0 ]; then
            if grep -Eq '^secret-paths: (OK|[0-9]+ blocked path\(s\))$' "$text"; then
              result=checked
            elif grep -q '(skipped, report mode)$' "$text"; then
              result=skipped
            fi
          fi
          token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')" || token="secret-paths-$$-$RANDOM"
          echo "::stop-commands::$token"
          cat "$text"
          echo "::$token::"
          {
            echo '### Secret path block (report mode)'
            if [ "$result" = error ]; then
              echo "**ERROR: the path block exited $rc without a result, so paths were not checked.**"
              echo
            elif [ "$result" = skipped ]; then
              echo 'Skipped by the checker (see below).'
              echo
            fi
            if grep -q '^  BLOCKED ' "$text"; then
              echo '**Blocked sensitive paths. Report mode: this does not block merging.**'
              echo
            fi
            if grep -q '^  gate_loosening ' "$text"; then
              echo "**GATE LOOSENING: needs a Grok Bot countersign plus Blaine's card.**"
              echo
            fi
            echo '```'
            cat "$text"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" = error ]; then exit 1; fi

      - name: Install gitleaks (pinned version and SHA-256)
        id: install
        # Runs even when the path block failed; needs only the base copies.
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        run: |
          set -uo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dir="$RUNNER_TEMP/gitleaks"
          rc=0
          # One && chain: bash ignores -e on the left of ||, so each command
          # must gate the next explicitly.
          curl --proto '=https' --tlsv1.2 -sSfL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}" &&
            echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c - &&
            mkdir -p "$dir" &&
            tar -xzf "$RUNNER_TEMP/$tarball" -C "$dir" gitleaks &&
            "$dir/gitleaks" version || rc=$?
          if [ "$rc" -ne 0 ]; then
            {
              echo '### gitleaks (report mode)'
              echo "**ERROR: gitleaks ${GITLEAKS_VERSION} could not be downloaded, matched to its pinned SHA-256, or started (exit $rc), so this PR's commits were not scanned.**"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "secret-scan: gitleaks install failed (exit $rc)"
            exit 1
          fi

      - name: gitleaks (PR commits only, redacted)
        id: scan
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -uo pipefail
          src="$RUNNER_TEMP/scan-src"
          report="$RUNNER_TEMP/gitleaks-report.json"
          log="$RUNNER_TEMP/gitleaks.log"
          list="$RUNNER_TEMP/gitleaks-findings.txt"
          git_err="$RUNNER_TEMP/git-log-stderr.txt"
          # gitleaks exits 1 on its own errors and Go exits 2 on a panic, so
          # findings get an exit code of their own.
          findings_exit=3
          # Nothing in the PR may hide its own content from the scan:
          # - The source is the base worktree from the base step, so git reads
          #   no .gitattributes, .gitmodules or .mailmap from the PR.
          # - --ignore-gitleaks-allow: an inline `gitleaks:allow` comment does
          #   not suppress a finding. Every exception lives in .gitleaks.toml.
          # - GIT_ATTR_SOURCE=<empty tree>: git reads no .gitattributes from a
          #   work tree or index, at any depth, so `-diff`, `binary`, or a diff
          #   or merge driver chosen by the PR has no effect. git's empty tree
          #   is SHA-1 here, like the 40-hex shas the base step checks.
          # - --text: git prints every file as text, including files it would
          #   call binary for a NUL byte. gitleaks skips binary diffs unread.
          # - --no-textconv: no conversion filter rewrites the content.
          # - --no-mailmap: git reads no .mailmap at all.
          # - --no-renames: a renamed file shows its whole content under its
          #   new name, so content first added at a path gitleaks skips (for
          #   example *.svg) cannot be renamed into scope unscanned.
          # - --diff-merges=remerge: a merge commit shows what its recorded
          #   result changed against git's own re-merge (conflict resolutions
          #   and edits made in the merge). Plain `git log -p` shows nothing
          #   for a merge.
          # gitleaks splits --log-opts on spaces and appends it to
          # `git -C <source> log -p -U0` (sources/git.go in v8.30.1).
          empty_tree=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          log_opts="--text --no-textconv --no-mailmap --no-renames --diff-merges=remerge ${BASE_SHA}..${HEAD_SHA}"
          read -r -a log_args <<< "$log_opts"
          rm -f "$report" "$list" "$git_err" || true
          # Fail closed on git errors. gitleaks v8.30.1 does not: it logs each
          # git stderr line as "ERR [git] ...", stops reading the diff, and
          # still exits 0 with what it saw (sources/git.go listenForStdErr,
          # detect/detect.go DetectSource). So run the same git log first and
          # trust the scan only if git exits 0 with nothing on stderr, and
          # treat any error in gitleaks' own log as an error too.
          git_rc=0
          GIT_ATTR_SOURCE="$empty_tree" git -C "$src" log -p -U0 "${log_args[@]}" > /dev/null 2> "$git_err" || git_rc=$?
          rc=0
          GIT_ATTR_SOURCE="$empty_tree" "$RUNNER_TEMP/gitleaks/gitleaks" git \
            --no-banner \
            --redact \
            --ignore-gitleaks-allow \
            --config "$RUNNER_TEMP/gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaksignore-base" \
            --log-opts="$log_opts" \
            --report-format json \
            --report-path "$report" \
            --exit-code "$findings_exit" \
            "$src" > "$log" 2>&1 || rc=$?
          # Count findings in the redacted report and list rule, file, line and
          # commit only. The Secret, Match and Line fields are never printed.
          # Control characters in a file name are escaped, so the name cannot
          # start a line of its own in the log or the step summary.
          count=""
          if [ -s "$report" ]; then
            count="$(node -e '
              const fs = require("node:fs");
              const [report, list] = process.argv.slice(1);
              const findings = JSON.parse(fs.readFileSync(report, "utf8"));
              if (!Array.isArray(findings)) process.exit(1);
              const safe = (v) => String(v).replaceAll(/[\p{Cc}\u2028\u2029]/gu, (c) => "\\u" + c.codePointAt(0).toString(16).padStart(4, "0"));
              const line = (f) => "- " + safe(f.RuleID) + " in " + safe(f.File) + ":" + safe(f.StartLine) + " (commit " + safe(f.Commit).slice(0, 12) + ")";
              fs.writeFileSync(list, findings.map(line).join("\n") + "\n");
              process.stdout.write(String(findings.length));
            ' "$report" "$list" 2>/dev/null)" || count=""
          fi
          result=error
          reason="gitleaks did not produce a usable report (exit $rc)"
          if [ "$git_rc" -ne 0 ] || [ -s "$git_err" ]; then
            reason="git could not read this PR's range cleanly (git log exit $git_rc, stderr below)"
          elif grep -Eq 'ERR|\[git\]|stderr is not empty|fatal:' "$log"; then
            reason="gitleaks logged an error (exit $rc), and gitleaks ${GITLEAKS_VERSION} stops reading git's output at the first git error without failing"
          elif [[ "$count" =~ ^[0-9]+$ ]]; then
            if [ "$rc" -eq 0 ] && [ "$count" -eq 0 ]; then
              result=clean
            elif [ "$rc" -eq "$findings_exit" ] && [ "$count" -gt 0 ]; then
              result=findings
            fi
          fi
          partial=0
          if [ "$result" = error ] && [[ "$count" =~ ^[0-9]+$ ]] && [ "$count" -gt 0 ]; then partial=1; fi
          token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')" || token="gitleaks-$$-$RANDOM"
          echo "::stop-commands::$token"
          cat "$log"
          if [ -s "$git_err" ]; then
            echo "git log stderr:"
            cat "$git_err"
          fi
          if [ "$result" = findings ] || [ "$partial" -eq 1 ]; then cat "$list"; fi
          echo "::$token::"
          {
            echo '### gitleaks (report mode)'
            case "$result" in
              clean)
                echo "No secrets found in this PR's commits (gitleaks ${GITLEAKS_VERSION}, redacted)."
                ;;
              findings)
                echo "**${count} possible secret(s) in this PR's commits. Report mode: this does not block merging.**"
                echo
                echo 'Values are redacted. Rule, file, line and commit only; the redacted report is the job artifact.'
                echo
                echo '```'
                cat "$list"
                echo '```'
                ;;
              *)
                echo "**ERROR: ${reason}, so nothing in this PR's commits was verified.**"
                if [ "$partial" -eq 1 ]; then
                  echo
                  echo "gitleaks still reported ${count} possible secret(s) before that (values redacted):"
                  echo
                  echo '```'
                  cat "$list"
                  echo '```'
                fi
                echo
                echo '```'
                cat "$log"
                echo '```'
                if [ -s "$git_err" ]; then
                  echo
                  echo 'git log stderr:'
                  echo
                  echo '```'
                  cat "$git_err"
                  echo '```'
                fi
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" = findings ]; then
            echo "::warning title=secret-scan::gitleaks found ${count} possible secret(s) in this PR's commits (report mode). See the job summary."
          fi
          if [ "$result" = error ]; then exit 1; fi

      - name: Upload redacted gitleaks report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-report-redacted
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7

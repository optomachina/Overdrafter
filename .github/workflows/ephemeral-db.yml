name: Ephemeral DB

# OVD-849 part 1. Proves a PR's migrations in a throwaway local Supabase database
# on the runner: start the stack from the base's supabase/ tree (HEAD^1, so only
# main's migrations), apply the PR's new migrations oldest first, run the policy
# pgTAP suite, then resolve touched migration drafts and pending pgTAP files to
# their issue families (ovd-NNN drafts, ovdNNN pending tests, and the drafts each
# pending test names), apply the families' drafts and run all of their pending
# tests. Retired (SUPERSEDED) drafts and drafts no pending test names are
# reported, not applied. scripts/ephemeral-db-apply.mjs does the work and names
# the first migration or draft that fails.
#
# It never connects to a hosted Supabase project and uses no secrets: the script
# accepts only a loopback database URL (scripts/supabase-target-guard.mjs).
#
# Report mode for the apply path: the job is non-required, and that step runs
# the script without --enforce, so the step exits 0 whatever the result. The
# JSON report (schema ovd849.ephemeral-db.v1, for OVD-845) is uploaded as the
# ephemeral-db-report artifact and summarised in the step summary. To block on
# the apply path later, pass enforce: true (which adds --enforce) and make the
# check required; do not change branch protection here.
#
# This generalises the per-issue ovdNNN-pending-pgtap.yml workflows. Rollback
# and DM-1R replay checks run in the "Roll back draft families (DM-1R)" step
# (scripts/ephemeral-db-apply.mjs --rollback). That step has no continue-on-error
# and fails this job when a family fails. The job stays off the required set,
# so the red X matches today's per-issue workflows and does not block a merge.
# The per-issue workflows can be retired once that stage has proven itself.
#
# The rollback step is pinned to the prepared base copy of the script and
# fails closed until --rollback is supported on base. It never falls back to
# the head script when the base copy lacks the flag.
#
# The script runs from the base commit (HEAD^1), so a PR cannot edit it to skip
# itself. When the base has no copy yet (the PR that introduces it), the head
# copy runs.
#
# Before promoting to enforce, three known gaps must be closed:
#
# - Base execution only partly protects the gate. Under pull_request this YAML
#   comes from the PR head, so a PR can edit the steps, or add a name to the
#   files= list that the base lacks, which flips every script to the head copy.
#   The report records it as checkerSource "head" (with a warning) so OVD-845
#   can refuse to count such a run. pr-body-gate.yml has the same limitation and
#   a "Gate change review" rule for it; add the equivalent here when enforcing.
# - The paths filter below means the check never reports on PRs outside those
#   paths, so as a required check it would leave them pending forever. Enforcing
#   needs an always-run no-op path for unrelated PRs (as pr-body-gate.yml has for
#   merge_group), not just the filter.
# - workflow_dispatch and workflow_call check out a branch tip, not a pull_request
#   merge commit, so HEAD^1 is just the previous commit and the diff covers only
#   that commit. Use those triggers for smoke runs, not as a PR verdict; a caller
#   that needs a real base should add a base input and pass it as --base.

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - 'docs/migration-drafts/**'
      - 'scripts/ephemeral-db-apply.mjs'
      - 'scripts/supabase-target-guard.mjs'
      - 'scripts/run-supabase-policy-tests.mjs'
      - '.github/workflows/ephemeral-db.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      enforce:
        description: Fail the job when the ephemeral database result is not pass.
        type: boolean
        default: false

concurrency:
  group: ephemeral-db-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ephemeral-db:
    name: ephemeral-db
    runs-on: ubuntu-24.04
    # The apply path and the rollback stage each start a local database.
    timeout-minutes: 45
    # Not a required check. The apply step stays in report mode (exit 0).
    # The rollback step has no continue-on-error and fails this job.
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      # pull_request checks out the merge commit of the PR head into the current
      # base tip, so HEAD^1 is the base as merged.
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.78.1

      - name: Cache Supabase images
        uses: ./.github/actions/supabase-image-cache
        with:
          group: db

      - name: Cache pgTAP client images
        uses: ./.github/actions/supabase-image-cache
        with:
          group: tools

      - name: Prepare checker from base
        run: |
          set -euo pipefail
          gate="$RUNNER_TEMP/gate"
          mkdir -p "$gate/scripts"
          files="scripts/ephemeral-db-apply.mjs scripts/supabase-target-guard.mjs scripts/migration-timestamp.mjs scripts/run-supabase-policy-tests.mjs scripts/ovd462-lease-race.mjs scripts/ovd591-psql-concurrency.mjs"
          source=base
          for file in $files; do
            git cat-file -e "HEAD^1:$file" 2>/dev/null || source="head"
          done
          for file in $files; do
            if [ "$source" = base ]; then
              git show "HEAD^1:$file" > "$gate/$file"
            else
              cp "$file" "$gate/$file"
            fi
          done
          echo "Checker scripts taken from: $source"
          echo "CHECKER_SOURCE=$source" >> "$GITHUB_ENV"

      - name: Apply PR migrations and run pgTAP (ephemeral DB)
        env:
          ENFORCE: ${{ inputs.enforce && '--enforce' || '' }}
        run: |
          set -euo pipefail
          git diff --name-status --no-renames HEAD^1 HEAD
          options=()
          if [ -n "$ENFORCE" ]; then options+=("$ENFORCE"); fi
          node "$RUNNER_TEMP/gate/scripts/ephemeral-db-apply.mjs" \
            --root "$GITHUB_WORKSPACE" --base HEAD^1 --head HEAD \
            --db-url "$DB_URL" --psql docker \
            --work-dir "$RUNNER_TEMP/ephemeral-db" --checker-source "$CHECKER_SOURCE" \
            --report "$RUNNER_TEMP/ephemeral-db-report.json" "${options[@]}"

      - name: Stop local database before rollback stage
        # Free the loopback port before the rollback stage starts its own stack.
        run: supabase stop --no-backup --workdir "$RUNNER_TEMP/ephemeral-db/base-project" || true

      - name: Roll back draft families (DM-1R)
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/gate/scripts/ephemeral-db-apply.mjs" \
            --root "$GITHUB_WORKSPACE" --base HEAD^1 --head HEAD \
            --db-url "$DB_URL" --psql docker \
            --work-dir "$RUNNER_TEMP/ephemeral-db-rollback" --checker-source "$CHECKER_SOURCE" \
            --report "$RUNNER_TEMP/ephemeral-db-rollback-report.json" --rollback

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ephemeral-db-report
          path: |
            ${{ runner.temp }}/ephemeral-db-report.json
            ${{ runner.temp }}/ephemeral-db-rollback-report.json
          if-no-files-found: warn

      - name: Stop local database
        if: always()
        # --workdir: stop the stack the base copy's config.toml started, even if
        # the PR changes project_id or ports in the head's config.toml.
        run: |
          supabase stop --no-backup --workdir "$RUNNER_TEMP/ephemeral-db/base-project" || true
          supabase stop --no-backup --workdir "$RUNNER_TEMP/ephemeral-db-rollback/base-project" || true

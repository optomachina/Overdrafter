name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Full history, file contents fetched on demand (blobless).
          filter: blob:none

      - name: Setup Node.js and install root dependencies
        uses: ./.github/actions/setup-root-dependencies

      - name: Verify migration lineage
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          npm run verify:migration-lineage -- --against-base | tee "$RUNNER_TEMP/migration-lineage.log"
          if ! grep -Fq 'Supabase migration-lineage verification passed' "$RUNNER_TEMP/migration-lineage.log"; then
            echo "::error::Migration lineage verifier exited successfully without validation evidence."
            exit 1
          fi

      - name: Verify migration function collisions
        run: npm run verify:migration-function-collisions

      - name: Lint
        run: bash scripts/preflight.sh lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js and install root dependencies
        uses: ./.github/actions/setup-root-dependencies

      - name: Typecheck
        run: bash scripts/preflight.sh typecheck

  # The contract, database and integration checks. The vitest suite runs in the
  # unit job. Only this job needs ovd591-qualification (for the policy tests).
  test:
    needs: ovd591-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Full history, file contents fetched on demand (blobless).
          filter: blob:none

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.78.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Setup Node.js and install root dependencies
        uses: ./.github/actions/setup-root-dependencies

      - name: Install worker dependencies
        run: npm --prefix worker ci

      - name: Test portable Node contracts
        run: npm run test:portable-node

      - name: Check provider integrations
        run: |
          set -euo pipefail
          npm run --silent provider:check | tee "$RUNNER_TEMP/provider-check.json"
          if ! test -s "$RUNNER_TEMP/provider-check.json" || ! jq -e '.ok == true' "$RUNNER_TEMP/provider-check.json" > /dev/null; then
            echo "::error::Provider check exited successfully without an ok JSON verdict."
            exit 1
          fi

      - name: Verify free-quote SQL source fixtures
        run: |
          node --test scripts/generate-free-quote-fixtures.node-test.mjs scripts/run-supabase-policy-tests.node-test.mjs
          node scripts/generate-free-quote-fixtures.mjs --check

      - name: Test Edge Functions
        run: npm run test:functions

      - name: Start local Supabase
        run: npm run db:start

      - name: Reset local database
        run: npm run db:reset

      # This guarded, committing suite owns a socket-only runner; pg_prove must
      # not copy it into the generic policy lane. Run before any dev seeding.
      - name: Test reconcile claim fence concurrency on local database
        run: node scripts/test-reconcile-claim-fence.mjs --ci-local "$RUNNER_TEMP/reconcile-claim-fence"

      - name: Test database policies after independent-session replacement
        env:
          OVD591_PSQL_QUALIFIED: ${{ needs.ovd591-qualification.result }}
        run: node scripts/run-supabase-policy-tests.mjs

      - name: Seed local database
        run: npm run seed:dev

      - name: Validate agent control plane
        run: npm run test:agent-control-plane

      - name: Test quote integration
        run: npm run test:integration:quote

  # The vitest suite in three shards. --shard deals files out by a hash of their
  # path, so the OCR and real-browser suites can land in any shard and every
  # shard installs the same tools. No vitest file uses the local Supabase stack;
  # the one suite that does (test:integration:quote) runs in the test job.
  unit:
    # Pinned to noble: the OCR step below installs exact noble package versions,
    # so an ubuntu-latest image change must not break every PR.
    runs-on: ubuntu-24.04
    # A shard runs about 5 minutes of tests, but on a cold apt cache with a slow
    # mirror its setup alone has taken about 15 (OVD-1062).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Full history, file contents fetched on demand (blobless).
          filter: blob:none

      - name: Setup Node.js and install root dependencies
        uses: ./.github/actions/setup-root-dependencies

      # As in extraction-gate, no install scripts: the worker's only ones are
      # esbuild's binary check, impit's package-manager check, and the native
      # build of better-sqlite3, which only camoufox-js reaches at browser launch.
      - name: Install worker dependencies
        run: npm --prefix worker ci --ignore-scripts

      - name: Restore apt package archives
        id: apt-archives
        uses: ./.github/actions/restore-apt-archives
        with:
          name: ocr-and-chromium-deps

      # The worker OCR suite (pdfDrawing.ocr.test.ts) skips without these tools.
      # Versions match worker/Dockerfile so CI reads the stamp the way production does.
      - name: Install poppler and tesseract for OCR tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q --no-install-recommends poppler-utils \
            libtesseract5=5.3.4-1build5 tesseract-ocr=5.3.4-1build5 tesseract-ocr-eng=1:4.1.0-2 tesseract-ocr-osd=1:4.1.0-2
          tesseract --list-langs | grep -qx eng

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(node -p "require('playwright/package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium for DOM recovery tests
        run: node ./node_modules/playwright/cli.js install --with-deps chromium

      - name: Save apt package archives
        uses: ./.github/actions/save-apt-archives
        with:
          key-prefix: ${{ steps.apt-archives.outputs.key-prefix }}
          matched-key: ${{ steps.apt-archives.outputs.matched-key }}

      - name: Run tests
        run: bash scripts/preflight.sh test -- --shard=${{ matrix.shard }}/3

  # Three lanes on separate runners. Each lane installs the same browser tooling;
  # only the authenticated lane starts the local Supabase stack.
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [synthetic, fixture, authenticated]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.78.1

      - name: Setup Node.js and install root dependencies
        uses: ./.github/actions/setup-root-dependencies

      - name: Restore apt package archives
        id: apt-archives
        uses: ./.github/actions/restore-apt-archives
        with:
          name: chromium-deps

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(node -p "require('playwright/package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        run: node ./node_modules/playwright/cli.js install --with-deps chromium

      - name: Save apt package archives
        uses: ./.github/actions/save-apt-archives
        with:
          key-prefix: ${{ steps.apt-archives.outputs.key-prefix }}
          matched-key: ${{ steps.apt-archives.outputs.matched-key }}

      - name: Verify installed sandbox-capable Chrome
        run: test -x /opt/google/chrome/chrome && /opt/google/chrome/chrome --version

      - name: Test admin operations browser workflows
        if: ${{ matrix.lane == 'synthetic' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: admin-operations-results/report.json
        run: node ./node_modules/playwright/cli.js test --config e2e/admin-operations.config.ts --output=admin-operations-results --reporter=line,json

      - name: Retain admin operations browser evidence
        if: ${{ always() && matrix.lane == 'synthetic' }}
        uses: actions/upload-artifact@v4
        with:
          name: admin-operations-browser-evidence
          path: admin-operations-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Test Free quote confirmation and replay in browser
        if: ${{ matrix.lane == 'synthetic' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: quote-confirmation-results/report.json
        run: npm run e2e:quote-confirmation -- --output=quote-confirmation-results --reporter=line,json

      - name: Retain Free quote confirmation browser evidence
        if: ${{ always() && matrix.lane == 'synthetic' }}
        uses: actions/upload-artifact@v4
        with:
          name: quote-confirmation-browser-evidence
          path: quote-confirmation-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Test fixture browser workflows
        if: ${{ matrix.lane == 'fixture' }}
        run: npm run e2e:fixture

      - name: Start local Supabase
        if: ${{ matrix.lane == 'authenticated' }}
        run: npm run db:start

      - name: Reset local database
        if: ${{ matrix.lane == 'authenticated' }}
        run: npm run db:reset

      - name: Seed local database
        if: ${{ matrix.lane == 'authenticated' }}
        run: npm run seed:dev

      - name: Test authenticated browser workflows
        if: ${{ matrix.lane == 'authenticated' }}
        run: npm run e2e:authenticated -- --output=authenticated-results

      - name: Retain authenticated browser evidence
        if: ${{ failure() && matrix.lane == 'authenticated' }}
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-browser-evidence
          path: authenticated-results/
          retention-days: 7
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js and install root dependencies
        uses: ./.github/actions/setup-root-dependencies

      - name: Build app
        run: npm run build

      - name: Build private sample UI
        run: npm run build:sample-plate

  # OVD-847: every changed RLS policy needs tagged anon / other_user /
  # role_boundary deny tests (docs/rls-deny-coverage.md). Report mode for now:
  # the job never fails the build and is not in the `ci` aggregate below.
  # Enforce later by passing --enforce and adding it to `ci`.
  # The checker runs from the base copy (HEAD^1), so a PR cannot edit it to
  # skip itself. When the base has no copy yet, the head copy runs.
  # Baseline growth and edits to the checker or this job are reported as
  # gate_loosening (Grok Bot countersign + Blaine's card); report only.
  rls-deny-coverage:
    name: rls-deny-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      # pull_request checks out the PR merged into the base tip, so HEAD^1 is
      # the base as merged; push and merge_group commits have their base there too.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check RLS deny coverage
        run: |
          set -euo pipefail
          checker="$RUNNER_TEMP/check-rls-deny-coverage.mjs"
          file=scripts/check-rls-deny-coverage.mjs
          if git cat-file -e "HEAD^1:$file" 2>/dev/null; then
            git show "HEAD^1:$file" > "$checker"
            echo "Checker taken from: base"
          else
            cp "$file" "$checker"
            echo "Checker taken from: head"
          fi
          node "$checker" --root . --base-ref HEAD^1 --head-ref HEAD \
            --json-out "$RUNNER_TEMP/rls-deny-coverage.json" | tee "$RUNNER_TEMP/rls-deny-coverage.txt"
          {
            echo '### RLS deny coverage (report mode)'
            # Report only (Plan §6): gate_loosening never fails this job.
            if jq -e '.gate_loosening.detected == true' "$RUNNER_TEMP/rls-deny-coverage.json" > /dev/null 2>&1; then
              echo "**GATE LOOSENING: needs Grok Bot countersign + Blaine's card.**"
              jq -r '.gate_loosening.reasons[] | "- " + .message' "$RUNNER_TEMP/rls-deny-coverage.json"
              echo
            fi
            echo '```'
            cat "$RUNNER_TEMP/rls-deny-coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload RLS deny coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rls-deny-coverage
          path: ${{ runner.temp }}/rls-deny-coverage.json
          if-no-files-found: warn

  verify-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        run: npm --prefix worker ci

      - name: Verify worker
        run: npm run verify:worker

  # Pre-merge regression gate on extraction quality. Runs only when a corpus
  # exists and a provider key is available, and reports "skipped" otherwise so
  # an empty corpus never reads as a passing quality signal.
  # Each gate step emits one machine line EXTRACTION_GATE_RESULT=pass|fail|error
  # (eval:gate exit 0 / 1 / anything else) and the `ci` job decides from it per
  # EXTRACTION_GATE_MODE (OVD-869). Only a clean quality fail (exit 1) leaves
  # this job green for the mode to decide; a crash (any other exit) still fails
  # the job after emitting its line, and so does any non-gate step, which fails
  # ci in every mode.
  extraction-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      corpus: ${{ steps.corpus.outputs.present }}
      result-line: ${{ steps.gate-parser.outputs.line }}${{ steps.gate-full.outputs.line }}

    # Declared at job level on purpose: a step's own `env` block is not in scope
    # for that step's `if` condition, so gating on `env.OPENAI_API_KEY` there
    # always reads empty and the gate silently never runs.
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # The gate reads PDFs off disk and never contacts Supabase, but the shared
      # worker config loader validates these, so placeholders keep it runnable
      # without production credentials.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      # The gate only reads PDFs and calls provider HTTP APIs; it never needs a
      # browser, so lifecycle scripts (which fetch Playwright/Patchright
      # binaries) are skipped.
      - name: Install worker dependencies
        run: npm --prefix worker ci --ignore-scripts

      # The extraction pipeline shells out to pdftotext/pdfinfo/pdftoppm.
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -q poppler-utils

      - name: Check for eval corpus
        id: corpus
        run: |
          if [ -d worker/eval-corpus/cases ] && [ -n "$(ls -A worker/eval-corpus/cases 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No extraction eval corpus checked in; skipping the quality gate. See worker/eval-corpus/README.md."
          fi

      # Any supported provider enables the production path, not OpenAI alone:
      # the configured model may route to Anthropic or OpenRouter, and gating on
      # one vendor's key would silently downgrade those deployments to
      # parser-only while reporting a full-path run.
      - name: Detect provider credentials
        id: creds
        run: |
          if [ -n "$OPENAI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$OPENROUTER_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Without credentials the deterministic parser is still worth gating on —
      # it produces most title-block values. Fallback is disabled explicitly
      # rather than left to depend on which secrets happen to be set, so the run
      # is reproducible.
      - name: Run extraction gate (parser only)
        id: gate-parser
        if: ${{ steps.corpus.outputs.present == 'true' && steps.creds.outputs.present == 'false' }}
        env:
          DRAWING_EXTRACTION_ENABLE_MODEL_FALLBACK: "false"
        run: |
          echo "::notice::No provider key configured; gating the deterministic parser only. Model-fallback fields are not measured."
          set +e
          npm --prefix worker run eval:gate
          code=$?
          set -e
          case "$code" in 0) result=pass ;; 1) result=fail ;; *) result=error ;; esac
          echo "eval:gate exited $code"
          echo "EXTRACTION_GATE_RESULT=$result"
          echo "line=EXTRACTION_GATE_RESULT=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = "error" ]; then exit "$code"; fi

      - name: Run extraction gate (full production path)
        id: gate-full
        if: ${{ steps.corpus.outputs.present == 'true' && steps.creds.outputs.present == 'true' }}
        run: |
          set +e
          npm --prefix worker run eval:gate
          code=$?
          set -e
          case "$code" in 0) result=pass ;; 1) result=fail ;; *) result=error ;; esac
          echo "eval:gate exited $code"
          echo "EXTRACTION_GATE_RESULT=$result"
          echo "line=EXTRACTION_GATE_RESULT=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = "error" ]; then exit "$code"; fi

  ovd420-recovery-egress-network:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install synthetic network proof dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -q dnsmasq-base haproxy iproute2 iptables jq openssl dnsutils util-linux

      - name: Prove recovery egress fail-closed network boundary
        run: sudo bash scripts/verify-ovd420-recovery-egress-network.sh

  ovd591-qualification:
    uses: ./.github/workflows/ovd591-qualification.yml

  ovd591-retention-qualification:
    uses: ./.github/workflows/ovd591-retention-qualification.yml

  free-quote-sql-qualification:
    uses: ./.github/workflows/free-quote-sql-qualification.yml

  # OVD-871: supabase/migrations is append-only (docs/migration-immutability.md).
  # Only added files with a timestamp after the newest base migration pass;
  # modified, deleted, renamed, copied and mode-only changes are violations.
  # Report mode (Blaine approved shipping it, 2026-10-16): continue-on-error and
  # not in the `ci` aggregate's needs, so it never blocks a merge. Making it
  # required or passing --enforce is a separate, later approval.
  # The checker runs from the base copy (HEAD^1), so a PR's edits to it take
  # effect only after merge. When the base has no copy yet, the head copy runs.
  # The migration-edit-approved label waives violations only when the PR
  # timeline shows Blaine applied it after the head was pushed; that waiver and
  # edits to the checker or this job are reported as gate_loosening.
  migration-immutability:
    name: migration-immutability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      # pull_request checks out the PR merged into the base tip, so HEAD^1 is
      # the base as merged; push and merge_group commits have their base there too.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check migration immutability
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The synchronize/opened payload's updated_at is at or after the push
          # of this head, and re-runs keep the same payload.
          PR_HEAD_PUSHED_AT: ${{ github.event.pull_request.updated_at }}
        # GitHub runs this as `bash -e`; the checker's exit is captured, never
        # trips -e, so the summary is always written.
        run: |
          set -uo pipefail
          checker="$RUNNER_TEMP/check-migration-immutability.mjs"
          file=scripts/check-migration-immutability.mjs
          if git cat-file -e "HEAD^1:$file" 2>/dev/null; then
            git show "HEAD^1:$file" > "$checker"
            echo "Checker taken from: base"
          else
            cp "$file" "$checker"
            echo "Checker taken from: head"
          fi
          override=()
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ -n "${PR_NUMBER:-}" ]; then
            timeline="$RUNNER_TEMP/migration-immutability-timeline.ndjson"
            if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/timeline" --jq '.[]' > "$timeline" 2> /dev/null; then
              override=(--timeline "$timeline")
            else
              override=(--timeline-error "gh api timeline request failed")
            fi
            override+=(--head-sha "$PR_HEAD_SHA" --head-pushed-at "$PR_HEAD_PUSHED_AT")
          fi
          report="$RUNNER_TEMP/migration-immutability.json"
          text="$RUNNER_TEMP/migration-immutability.txt"
          # Report mode: findings exit 0. A non-zero exit means the checker could not run.
          rc=0
          # ${override[@]+...} keeps an empty array from tripping set -u on bash 3.2.
          node "$checker" --root . --base-ref HEAD^1 --head-ref HEAD ${override[@]+"${override[@]}"} \
            --json-out "$report" > "$text" 2>&1 || rc=$?
          cat "$text"
          {
            echo '### Migration immutability (report mode)'
            if [ "$rc" -ne 0 ] || [ ! -s "$report" ]; then
              echo "**ERROR: the checker did not produce a report (exit $rc), so nothing was checked.**"
              echo
            fi
            # Report only: gate_loosening never fails this job.
            if grep -q '^GATE LOOSENING' "$text"; then
              echo "**GATE LOOSENING: needs Blaine's explicit OK before merge.**"
              echo
            fi
            echo '```'
            cat "$text"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A checker that could not run fails this job loudly (red) but never
          # blocks a merge: the job has continue-on-error and is not in `ci`.
          if [ "$rc" -ne 0 ] || [ ! -s "$report" ]; then exit 1; fi

      - name: Upload migration immutability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-immutability
          path: ${{ runner.temp }}/migration-immutability.json
          if-no-files-found: warn

  ci:
    name: ci
    if: ${{ always() }}
    needs:
      - lint
      - typecheck
      - test
      - unit
      - browser-test
      - build
      - verify-worker
      - extraction-gate
      - ovd420-recovery-egress-network
      - ovd591-qualification
      - ovd591-retention-qualification
      - free-quote-sql-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check dependency results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_TEST_RESULT: ${{ needs.browser-test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          WORKER_RESULT: ${{ needs.verify-worker.result }}
          EXTRACTION_GATE_RESULT: ${{ needs.extraction-gate.result }}
          OVD420_NETWORK_RESULT: ${{ needs.ovd420-recovery-egress-network.result }}
          OVD591_SQL_RESULT: ${{ needs.ovd591-qualification.result }}
          OVD591_RETENTION_SQL_RESULT: ${{ needs.ovd591-retention-qualification.result }}
          FREE_QUOTE_SQL_RESULT: ${{ needs.free-quote-sql-qualification.result }}
        run: |
          echo "lint=$LINT_RESULT"
          echo "typecheck=$TYPECHECK_RESULT"
          echo "test=$TEST_RESULT"
          echo "unit=$UNIT_RESULT"
          echo "browser-test=$BROWSER_TEST_RESULT"
          echo "build=$BUILD_RESULT"
          echo "verify-worker=$WORKER_RESULT"
          echo "extraction-gate=$EXTRACTION_GATE_RESULT"
          echo "ovd420-recovery-egress-network=$OVD420_NETWORK_RESULT"
          echo "ovd591-qualification=$OVD591_SQL_RESULT"
          echo "ovd591-retention-qualification=$OVD591_RETENTION_SQL_RESULT"
          echo "free-quote-sql-qualification=$FREE_QUOTE_SQL_RESULT"

          if [ "$LINT_RESULT" != "success" ] || \
             [ "$TYPECHECK_RESULT" != "success" ] || \
             [ "$TEST_RESULT" != "success" ] || \
             [ "$UNIT_RESULT" != "success" ] || \
             [ "$BROWSER_TEST_RESULT" != "success" ] || \
             [ "$BUILD_RESULT" != "success" ] || \
             [ "$WORKER_RESULT" != "success" ] || \
             [ "$OVD420_NETWORK_RESULT" != "success" ] || \
             [ "$OVD591_SQL_RESULT" != "success" ] || \
             [ "$OVD591_RETENTION_SQL_RESULT" != "success" ] || \
             [ "$FREE_QUOTE_SQL_RESULT" != "success" ]; then
            exit 1
          fi

          # Internal step skips still leave the job successful. Any other job
          # result, including a timeout reported as cancelled, must block the merge.
          if [ "$EXTRACTION_GATE_RESULT" != "success" ]; then
            exit 1
          fi

      - name: Checkout extraction gate decision script
        if: ${{ always() }}
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/extraction-gate-decision.mjs
            scripts/lib/entry-point.mjs
          sparse-checkout-cone-mode: false

      # EXTRACTION_GATE_MODE comes from the repository variable
      # vars.EXTRACTION_GATE_MODE, which only sets the default mode. It does not
      # stop a PR from changing the mode: on pull_request runs this workflow and
      # scripts/extraction-gate-decision.mjs are taken from the PR head, so a PR
      # can hardcode a mode here or edit the decision script. Protecting those
      # two files is a review convention, not something the variable provides:
      # .github/CODEOWNERS is visibility-only and required code-owner review is
      # off, so nothing enforces that review.
      # Values: report (default; unset or anything else) or enforce. Flipping
      # the variable to enforce requires Blaine's approval. The mode governs
      # only the parsed result line (fail/error: warning in report, fail in
      # enforce); any unsuccessful extraction-gate job fails ci above in every mode.
      - name: Decide extraction gate
        if: ${{ always() }}
        env:
          EXTRACTION_GATE_MODE: ${{ vars.EXTRACTION_GATE_MODE }}
          EXTRACTION_GATE_OUTPUT: ${{ needs.extraction-gate.outputs.result-line }}
          EXTRACTION_GATE_CORPUS: ${{ needs.extraction-gate.outputs.corpus }}
          EXTRACTION_GATE_JOB_RESULT: ${{ needs.extraction-gate.result }}
        run: |
          set -euo pipefail
          node scripts/extraction-gate-decision.mjs | tee "$RUNNER_TEMP/extraction-gate-decision.log"
          if ! grep -Eq '^extraction-gate mode=\S+ result=\S+ exit=' "$RUNNER_TEMP/extraction-gate-decision.log"; then
            echo "::error::Extraction gate decision exited successfully without decision evidence."
            exit 1
          fi

name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.78.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install worker dependencies
        run: npm --prefix worker ci

      - name: Start local Supabase
        run: npm run db:start

      - name: Reset local database
        run: npm run db:reset

      - name: Test database policies
        run: supabase test db --local

      - name: Seed local database
        run: npm run seed:dev

      - name: Run tests
        run: npm run test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build app
        run: npm run build

  verify-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        run: npm --prefix worker ci

      - name: Verify worker
        run: npm run verify:worker

  # Pre-merge regression gate on extraction quality. Runs only when a corpus
  # exists and a provider key is available, and reports "skipped" otherwise so
  # an empty corpus never reads as a passing quality signal.
  extraction-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        run: npm --prefix worker ci

      # The extraction pipeline shells out to pdftotext/pdfinfo/pdftoppm.
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -q poppler-utils

      - name: Check for eval corpus
        id: corpus
        run: |
          if [ -d worker/eval-corpus/cases ] && [ -n "$(ls -A worker/eval-corpus/cases 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No extraction eval corpus checked in; skipping the quality gate. See worker/eval-corpus/README.md."
          fi

      - name: Run extraction gate
        if: ${{ steps.corpus.outputs.present == 'true' && env.OPENAI_API_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm --prefix worker run eval:gate

      - name: Report missing credentials
        if: ${{ steps.corpus.outputs.present == 'true' && env.OPENAI_API_KEY == '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: echo "::warning::Eval corpus is present but no provider key is configured; the extraction gate did not run."

  ci:
    name: ci
    if: ${{ always() }}
    needs:
      - lint
      - typecheck
      - test
      - build
      - verify-worker
      - extraction-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check dependency results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          WORKER_RESULT: ${{ needs.verify-worker.result }}
          EXTRACTION_GATE_RESULT: ${{ needs.extraction-gate.result }}
        run: |
          echo "lint=$LINT_RESULT"
          echo "typecheck=$TYPECHECK_RESULT"
          echo "test=$TEST_RESULT"
          echo "build=$BUILD_RESULT"
          echo "verify-worker=$WORKER_RESULT"
          echo "extraction-gate=$EXTRACTION_GATE_RESULT"

          if [ "$LINT_RESULT" != "success" ] || \
             [ "$TYPECHECK_RESULT" != "success" ] || \
             [ "$TEST_RESULT" != "success" ] || \
             [ "$BUILD_RESULT" != "success" ] || \
             [ "$WORKER_RESULT" != "success" ]; then
            exit 1
          fi

          # The gate legitimately skips when no corpus or provider key exists,
          # but a real failure must block the merge.
          if [ "$EXTRACTION_GATE_RESULT" = "failure" ]; then
            exit 1
          fi

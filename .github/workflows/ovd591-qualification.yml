name: OVD-591 SQL qualification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  capability-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OVD591_EVIDENCE: ${{ runner.temp }}/ovd591-${{ github.run_id }}-${{ github.run_attempt }}-evidence
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test fixture and qualification transport contracts
        run: node --test scripts/ovd591-ci-fixture.node-test.mjs scripts/ovd591-sql-qualification.node-test.mjs scripts/ovd591-psql-concurrency.node-test.mjs
      - name: Provision and run actual SQL qualification
        run: node scripts/ovd591-ci-fixture.mjs run "$OVD591_EVIDENCE"
      - name: Confirm exclusively owned cleanup
        if: always()
        shell: bash
        run: |
          if test -f "$OVD591_EVIDENCE/owned-state.json"; then
            node scripts/ovd591-ci-fixture.mjs cleanup "$OVD591_EVIDENCE"
          fi
      - name: Retain synthetic qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ovd591-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OVD591_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 14

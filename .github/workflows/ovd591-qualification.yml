name: OVD-591 SQL qualification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  capability-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set runner-local evidence path
        shell: bash
        run: echo "OVD591_EVIDENCE=$RUNNER_TEMP/ovd591-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Full history, file contents fetched on demand (blobless).
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test fixture and qualification transport contracts
        run: node --test scripts/ovd591-image-pull.node-test.mjs scripts/ovd591-workflow-context.node-test.mjs scripts/ovd591-ci-fixture.node-test.mjs scripts/ovd591-sql-qualification.node-test.mjs scripts/ovd591-psql-concurrency.node-test.mjs
      # Cache keyed on the exact pinned image reference. A loaded copy has no RepoDigests, so the fixture admits it only when
      # its image ID equals the receipt recorded at save time from a real registry pull; otherwise it pulls as before.
      - name: Resolve pinned Supabase image cache
        id: images
        run: |
          echo "OVD591_IMAGE_CACHE=$HOME/.cache/ovd591-images" >> "$GITHUB_ENV"
          node --input-type=module -e "
            const { IMAGE } = await import('./scripts/ovd591-sql-qualification.mjs');
            console.log('images=' + IMAGE); console.log('key=ovd591-ecr-v1-' + IMAGE);" >> "$GITHUB_OUTPUT"
      - name: Restore cached Supabase image
        id: image-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ovd591-images
          key: ${{ steps.images.outputs.key }}
      - name: Load cached Supabase image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: node scripts/ovd591-image-pull.mjs load "$OVD591_IMAGE_CACHE"
      - name: Provision and run actual SQL qualification
        run: |
          set -euo pipefail
          node scripts/ovd591-ci-fixture.mjs run "$OVD591_EVIDENCE"
          if ! test -s "$OVD591_EVIDENCE/fixture-result.json" || ! jq -e '.status == "passed"' "$OVD591_EVIDENCE/fixture-result.json" > /dev/null; then
            echo "::error::SQL qualification exited successfully without a passed fixture receipt."
            exit 1
          fi
      - name: Receipt and save the registry-pulled Supabase image
        id: image-save
        if: ${{ !cancelled() && steps.image-cache.outputs.cache-hit != 'true' }}
        env:
          IMAGES: ${{ steps.images.outputs.images }}
        run: if node scripts/ovd591-image-pull.mjs save "$OVD591_IMAGE_CACHE" $IMAGES; then echo "saved=true" >> "$GITHUB_OUTPUT"; fi
      - name: Store the Supabase image cache
        if: ${{ !cancelled() && steps.image-save.outputs.saved == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ovd591-images
          key: ${{ steps.images.outputs.key }}
      - name: Confirm exclusively owned cleanup
        if: always()
        shell: bash
        run: |
          if test -f "$OVD591_EVIDENCE/owned-state.json"; then
            node scripts/ovd591-ci-fixture.mjs cleanup "$OVD591_EVIDENCE"
          fi
      - name: Retain synthetic qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ovd591-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OVD591_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14

name: Release rehearsal source checks

on:
  pull_request:
    paths:
      - 'scripts/release-rehearsal/**'
      - '.github/workflows/release-rehearsal-source.yml'

jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run pure and fake-process tests
        run: node --test scripts/release-rehearsal/*.node-test.mjs

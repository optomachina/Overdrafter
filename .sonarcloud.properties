# Sonar settings for SonarCloud Automatic Analysis, which reads this file and not
# sonar-project.properties (that CLI-scanner copy was removed in OVD-597).
# The sonar.issue.ignore.multicriteria entries below are unproven under Automatic
# Analysis: earlier issue-ignore additions here (#484, #491, #530, #533, #536)
# were recorded as ineffective and removed. Findings that still appear are
# dispositioned per finding in the Sonar UI.

# Copy-paste detection exclusions.
# Keep intentionally parallel vendor adapters and known migration rewrites
# from tripping CPD quality gates on new code.
# Migrations often intentionally repeat prior function bodies before incremental edits.
# Fictiv adapter rollout intentionally mirrors mature Xometry paths for operational parity.
# Quantity-sweep CLI tools are intentionally parallel scaffolds, one per vendor.
# Provider manifests are schema-constrained records, generated catalogs repeat
# those records by design, and envelope tests intentionally share one contract.
# OVD-372 and OVD-379 deliberately repeat exact SQL authorization and policy
# contracts so reviewers can compare explicit provider states without indirection.
# OVD-558 generated SQL repeats exact catalog and grant payloads by design;
# only its two staged files are excluded from duplication, while other rules stay active.
# OVD-512 repeats established migration assertions and explicit replay-failure cases; keep all test rules active.
# OVD-575 retains explicit authorization and evidence checks in one forward migration.
# Generated files: provider catalogs (**/generated/**) and provider manifests
# (provider-integrations/*/manifest.v1.json) by pattern, the Supabase types file by
# exact path, and free-quote *.expanded.sql fixtures through supabase/fixtures/**.
# Those fixtures are generated byte-for-byte from their pgTAP sources and
# drift-checked by `generate-free-quote-fixtures.mjs --check` in CI.
# pgTAP suites and SQL fixtures deliberately restate exact contract literals,
# setup and copied statements (e.g. a guard test embedding its migration's DO
# block) so each test reads standalone. Every issue rule except plsql:S1192
# (entry e3 below) stays active on them.
sonar.cpd.exclusions=supabase/tests/**,supabase/fixtures/**,src/integrations/supabase/types.ts,provider-integrations/*/manifest.v1.json,**/generated/**,worker/src/adapters/*Envelope.test.ts,scripts/verify-ovd372-production-preconditions.sql,supabase/migrations/20260403103000_harden_client_quote_workspace_lineage.sql,supabase/migrations/20260405110000_seed_vendor_capability_profiles.sql,supabase/migrations/20260731102000_add_replay_safe_stripe_events.sql,supabase/migrations/20260817133902_add_quote_provider_admission_registry.sql,**/20260812042000_add_canonical_part_identity.sql,**/20260812043000_add_private_part_fingerprint_analytics.sql,**/20260812044000_enforce_quote_lane_eligibility.sql,**/canonical_part_identity.sql,**/private_part_fingerprint_analytics.sql,**/quote_lane_eligibility.sql,worker/src/scoring.ts,worker/src/adapters/fictiv.ts,worker/src/adapters/fictivConstraints.ts,worker/src/adapters/fictiv.test.ts,worker/src/adapters/extendedVendorWorkflows.ts,worker/src/tools/fictivAuth.ts,worker/src/tools/fictivQuantitySweep.ts,worker/src/tools/xometryQuantitySweep.ts,worker/src/tools/vendorAuth.ts,worker/src/tools/vendorWorkflowSmoke.ts,docs/release/ovd-558-verifier-authority-forward.sql,docs/release/ovd-558-verifier-authority-reverse.sql,src/features/quotes/capability-observation-ledger-migration.test.ts,supabase/migrations/20260927130000_ovd575_native_observer_registry.sql

# Automatic analysis does not recognize Deno.test and over-reports it.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.e1.resourceKey=**/stripe-events/index.test.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.e2.resourceKey=**/billing-sessions/index.test.ts
# PostgreSQL migrations and pgTAP fixtures intentionally repeat contract literals
# (SQLSTATEs, roles, columns, wire literals) across separate functions, DDL and
# independent assertions. Oracle package-level constants are unavailable here, and
# replacing them with procedural constants would make deployed DDL and test
# assertions harder to audit. Scoped to this one rule and to supabase/ SQL only;
# all other rules, including security and reliability rules, stay active.
# OVD-597 collapsed the former exact-file entries into this one, widening it to
# every supabase/ SQL file. It is unproven under Automatic Analysis (see the
# header). Post-merge check (docs/engineering-inbox.md): once this reaches main,
# confirm whether the existing plsql:S1192 issues on supabase/**/*.sql close; if
# they do not, remove this entry and keep dispositioning findings per finding.
sonar.issue.ignore.multicriteria.e3.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e3.resourceKey=supabase/**/*.sql
# This exact file is an immutable, production-recorded migration payload.
# Editing its historical comment syntax would invalidate the byte-level lineage
# contract enforced by verify:migration-lineage.
sonar.issue.ignore.multicriteria.e4.ruleKey=plsql:SingleLineCommentsSyntaxCheck
sonar.issue.ignore.multicriteria.e4.resourceKey=**/20260731010001_add_spend_caps_and_ledger.sql

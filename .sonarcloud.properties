# Sonar settings for SonarCloud Automatic Analysis, which reads this file and not
# sonar-project.properties (that CLI-scanner copy was removed in OVD-597).
# The sonar.issue.ignore.multicriteria entries below are unproven under Automatic
# Analysis: earlier issue-ignore additions here (#484, #491, #530, #533, #536)
# were recorded as ineffective and removed. Findings that still appear are
# dispositioned per finding in the Sonar UI.

# Copy-paste detection exclusions.
# Keep intentionally parallel vendor adapters and known migration rewrites
# from tripping CPD quality gates on new code.
# Migrations often intentionally repeat prior function bodies before incremental edits.
# Fictiv adapter rollout intentionally mirrors mature Xometry paths for operational parity.
# Quantity-sweep CLI tools are intentionally parallel scaffolds, one per vendor.
# Provider manifests are schema-constrained records, generated catalogs repeat
# those records by design, and envelope tests intentionally share one contract.
# OVD-372 and OVD-379 deliberately repeat exact SQL authorization and policy
# contracts so reviewers can compare explicit provider states without indirection.
# OVD-558 generated SQL repeats exact catalog and grant payloads by design;
# only its two staged files are excluded from duplication, while other rules stay active.
# OVD-512 repeats established migration assertions and explicit replay-failure cases; keep all test rules active.
# OVD-575 retains explicit authorization and evidence checks in one forward migration.
# Generated files: provider catalogs (**/generated/**) and provider manifests
# (provider-integrations/*/manifest.v1.json) by pattern, the Supabase types file by
# exact path, and free-quote *.expanded.sql fixtures through supabase/fixtures/**.
# Those fixtures are generated byte-for-byte from their pgTAP sources and
# drift-checked by `generate-free-quote-fixtures.mjs --check` in CI.
# pgTAP suites and SQL fixtures deliberately restate exact contract literals,
# setup and copied statements (e.g. a guard test embedding its migration's DO
# block) so each test reads standalone. All issue rules stay active on them.
# OVD-601 migration 20261004110000 restates two functions byte-for-byte; the byte-for-byte restate is mandated by the issue Scope.
# OVD-649 staged restoration is generated from the OVD-575 migration and restates its
# function body byte-for-byte by design (only that one generated file is excluded).
# OVD-628 migration 20261004130000 restates the OVD-458 request functions with their row locks moved into one NOWAIT helper; CREATE OR REPLACE requires the full restated bodies.
# OVD-462 migration 20261012212325 is the production-recorded window 1 payload (stored bytes equal the file); its six lease RPCs repeat the same identity, lock and ownership checks by design, and the bytes cannot change. Approved by Blaine on Oct 12.
# OVD-723 expand migration 20261013043000 and OVD-722 migration 20261013043100 are the production-recorded window 1 payloads (applied together on Oct 13; stored bytes equal the files); their RPCs repeat the same identity, lock and admin checks by design, and the bytes cannot change. Approved by Blaine on Oct 13.
# OVD-771 migration 20261015221725 and OVD-767 migration 20261016000156 are the production-recorded 2026-10-15 window payloads (hash-pinned in the reviewed free-quote manifest); their RPCs repeat the same verified-auth, AAL2 and admin checks by design, and the bytes cannot change. Approved by Blaine on Oct 20.
# OVD-762 migration draft restates the current Xometry resolver, request and worker preflight bodies and changes only the marker predicates, so a diff against the source migrations shows the whole change; its rollback restates the worker preflight byte-for-byte. Only these two draft files are excluded from duplication.
# OVD-707 migration drafts repeat the same verified-auth, admin and AAL2 guard, row lock and one-row audit shape in each lifecycle RPC by design, and the seed restates registry entries; only the ovd-707-* draft files are excluded from duplication.
# OVD-847 RLS deny-coverage fixtures (scripts/fixtures/rls-deny/**) repeat one migration and test per case by design; each fixture reads standalone.
# OVD-978 draft and rollback each restate the replaced function body byte for byte, so they share the leading CTE block by design; only these two draft files are excluded from duplication. Approved by Blaine on Oct 20.
# OVD-987 migration 20261020100000 restates seven function bodies (the Xometry beta resolver, request, worker preflight, free-beta meter and rollout setter) and changes only their quantity predicates; CREATE OR REPLACE requires the full bodies, and its rollback restates the previous bodies byte for byte. Only these two files are excluded from duplication; all issue rules stay active.
sonar.cpd.exclusions=supabase/tests/**,supabase/fixtures/**,scripts/fixtures/rls-deny/**,src/integrations/supabase/types.ts,provider-integrations/*/manifest.v1.json,**/generated/**,worker/src/adapters/*Envelope.test.ts,scripts/verify-ovd372-production-preconditions.sql,supabase/migrations/20260403103000_harden_client_quote_workspace_lineage.sql,supabase/migrations/20260405110000_seed_vendor_capability_profiles.sql,supabase/migrations/20260731102000_add_replay_safe_stripe_events.sql,supabase/migrations/20260817133902_add_quote_provider_admission_registry.sql,**/20260812042000_add_canonical_part_identity.sql,**/20260812043000_add_private_part_fingerprint_analytics.sql,**/20260812044000_enforce_quote_lane_eligibility.sql,**/canonical_part_identity.sql,**/private_part_fingerprint_analytics.sql,**/quote_lane_eligibility.sql,worker/src/scoring.ts,worker/src/adapters/fictiv.ts,worker/src/adapters/fictivConstraints.ts,worker/src/adapters/fictiv.test.ts,worker/src/adapters/extendedVendorWorkflows.ts,worker/src/tools/fictivAuth.ts,worker/src/tools/fictivQuantitySweep.ts,worker/src/tools/xometryQuantitySweep.ts,worker/src/tools/vendorAuth.ts,worker/src/tools/vendorWorkflowSmoke.ts,docs/release/ovd-558-verifier-authority-forward.sql,docs/release/ovd-558-verifier-authority-reverse.sql,src/features/quotes/capability-observation-ledger-migration.test.ts,supabase/migrations/20260927130000_ovd575_native_observer_registry.sql,supabase/migrations/20261004110000_reject_empty_job_file_uploads.sql,supabase/migrations/20261004130000_ovd628_generic_admission_nowait.sql,scripts/native/stop-observer/sql/store-native-observer-evidence-restore.staged.sql,supabase/migrations/20261012212325_ovd462_provider_session_lease.sql,supabase/migrations/20261013043000_ovd723_export_control_upload_block.sql,supabase/migrations/20261013043100_ovd722_provider_kill_switch.sql,docs/migration-drafts/ovd-762-xometry-fanout-scope.sql,docs/migration-drafts/ovd-762-xometry-fanout-scope.rollback.sql,docs/migration-drafts/ovd-771.sql,docs/migration-drafts/ovd-771.rollback.sql,src/components/admin/ProviderKillSwitchCard.test.tsx,src/components/admin/SpendCapCard.test.tsx,supabase/migrations/20261015221725_ovd771_service_kill_switch.sql,supabase/migrations/20261016000156_ovd767_admin_write_aal2_guards.sql\
,docs/migration-drafts/ovd-771.sql,docs/migration-drafts/ovd-771.rollback.sql,src/components/admin/ProviderKillSwitchCard.test.tsx,src/components/admin/SpendCapCard.test.tsx,docs/migration-drafts/ovd-766-*.sql,docs/migration-drafts/ovd-707-*.sql,docs/migration-drafts/ovd-978.sql,docs/migration-drafts/ovd-978.rollback.sql,supabase/migrations/20261020100000_ovd987_controlled_beta_user_quantity.sql,docs/migration-drafts/ovd-987.rollback.sql
# Automatic analysis does not recognize Deno.test and over-reports it.
sonar.issue.ignore.multicriteria=e1,e2,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.e1.resourceKey=**/stripe-events/index.test.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.e2.resourceKey=**/billing-sessions/index.test.ts
# OVD-597 post-main readback (2026-10-15): Automatic Analysis still reports
# plsql:S1192 under supabase/, so the ineffective e3 exclusion was removed.
# Retain per-finding disposition rather than implying this setting suppresses it.
# This exact file is an immutable, production-recorded migration payload.
# Editing its historical comment syntax would invalidate the byte-level lineage
# contract enforced by verify:migration-lineage.
sonar.issue.ignore.multicriteria.e4.ruleKey=plsql:SingleLineCommentsSyntaxCheck
sonar.issue.ignore.multicriteria.e4.resourceKey=**/20260731010001_add_spend_caps_and_ledger.sql
# OVD-799: design prototypes under docs/design/** are not shipped code. HTML mocks
# are static (a built mock is an inlined copy of its tools/*.src.html source), and
# tools/*.js are one-off local screenshot scripts for those mocks (they fall back to
# a local playwright-core install). Both are excluded from analysis. Designer-approved on Oct 16.
sonar.exclusions=docs/design/**/*.html,docs/design/**/tools/*.js
